<!-- 既定はダーク。JS を待たずに最初からダークで描く（読み込み時に白く光らないように） -->
<!doctype html><html lang="ja" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Kelpie.Inc 全事業ダッシュボード</title>
<style>
/* ══════════════════════════════════════════════════════════════
   BASE（共通トークン・チップ・表・詳細パネルの体裁）
   docs/company-dashboard/mockup-efg-build.py の BASE（211〜266行）を
   themable() 変換した出力。中身は作り直していない（9.3節）。
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fff; --surface:#fff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --subtle:#f6f8fa;
  --accent:#0969da; --line:#c6cdd5;
  --ok:#2b8a3e; --okbg:#d3f9d8; --warn:#e67700; --warnbg:#fff3bf;
  --bad:#c92a2a; --badbg:#ffe3e3; --off:#868e96; --offbg:#e9ecef;
  --shadow:0 1px 3px rgba(31,35,40,.10),0 8px 24px rgba(31,35,40,.06);
  --r:9px; --r-lg:11px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --bw:1px; --tracking:normal; --nmw:800;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--surface:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;
  --accent:#4493f8;--line:#4a525c;--ok:#3fb950;--okbg:#0f2e18;--warn:#d29922;--warnbg:#3a2c05;
  --bad:#f85149;--badbg:#3a1417;--off:#8b949e;--offbg:#21262d;
  --shadow:0 1px 3px rgba(1,4,9,.6),0 8px 24px rgba(1,4,9,.4);}}:root[data-theme="dark"]{
  --bg:#0d1117;--surface:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;
  --accent:#4493f8;--line:#4a525c;--ok:#3fb950;--okbg:#0f2e18;--warn:#d29922;--warnbg:#3a2c05;
  --bad:#f85149;--badbg:#3a1417;--off:#8b949e;--offbg:#21262d;
  --shadow:0 1px 3px rgba(1,4,9,.6),0 8px 24px rgba(1,4,9,.4);}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 var(--font);letter-spacing:var(--tracking);
  -webkit-font-smoothing:antialiased}
/* button は color を継承しない。指定しないとダークモードで UA の ButtonText（黒）が
   そのまま出て、色付きカードの上の数字が読めなくなる（実測コントラスト比 1.4）。 */
button{color:inherit;font-family:inherit}
h1{font-size:19px;margin:0 0 3px} .sub{color:var(--muted);font-size:12.5px;margin:0}
a{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.g{--c:var(--ok);--cb:var(--okbg)} .y{--c:var(--warn);--cb:var(--warnbg)}
.r{--c:var(--bad);--cb:var(--badbg)} .o{--c:var(--off);--cb:var(--offbg)}
.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}
.dot.r{background:var(--bad)}.dot.o{background:var(--off)}
.flag{font-size:10.5px;padding:1px 7px;border-radius:20px;white-space:nowrap;font-weight:600;
  background:var(--cb);color:var(--c)}
.flag.g{background:var(--okbg);color:var(--ok)}.flag.y{background:var(--warnbg);color:var(--warn)}
.flag.r{background:var(--badbg);color:var(--bad)}.flag.o{background:var(--offbg);color:var(--off)}
.bar{height:5px;border-radius:3px;background:var(--offbg);overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.g{background:var(--ok)}.bar i.y{background:var(--warn)}
.bar i.r{background:var(--bad)}.bar i.o{background:var(--off)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 4px}
th,td{border:1px solid var(--border);padding:5px 10px;text-align:left}
th{background:var(--subtle);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:nth-child(2n) td{background:var(--subtle)}
code{background:var(--subtle);border-radius:5px;padding:.12em .38em;font-size:88%;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.dtl h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  margin:18px 0 8px;font-weight:700}
.dtl h3:first-child{margin-top:0}
.dtl ol,.dtl ul{margin:0;padding-left:1.4em;font-size:13.5px}
.dtl li{margin:.3em 0}
.dtl .path{font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin:0 0 12px}
.dtl .lead{margin:0 0 16px;font-size:13.5px}
.dtl .why{font-size:12px;color:var(--c);font-weight:600;margin:0 0 10px}
/* ── 月次目標ブロック（詳細パネルの先頭・案B） ── */
.goalb{border:var(--bw) solid var(--c);background:var(--cb);border-radius:var(--r-lg);padding:14px 16px;margin:0 0 18px}
.goalb .gh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.goalb .gh .ttl{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.03em}
.goalb .gh .due{font-size:11px;color:var(--muted);margin-left:auto}
.goalb .hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.goalb .pct{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--c)}
.goalb .pct small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.goalb .rem{display:flex;gap:24px;flex-wrap:wrap}
.goalb .rem .k{font-size:10.5px;color:var(--muted)}
.goalb .rem .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.goalb .bar{background:rgba(128,128,128,.22)}
.goalb .pacen{font-size:12px;color:var(--muted);margin:10px 0 0}
.goalb .pacen b{color:var(--fg);font-variant-numeric:tabular-nums}
/* 週の通過点（月次を等速で割ったもの）。目標は増やさず、同じ1本を週で見る */
.goalb .wk{margin:12px 0 0;border-top:1px solid var(--border);padding-top:10px}
.goalb .wk .wkh{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:6px}
.goalb .wk table{font-size:12px}
.goalb .wk th,.goalb .wk td{padding:4px 8px}
.goalb .wk tr.now td{background:var(--cb);font-weight:700}
.goalb .wk .wkn{font-size:12px;color:var(--muted);margin:6px 0 0}
.goalb .wk .wkn b{color:var(--fg);font-variant-numeric:tabular-nums}
.goalb .wk td{white-space:nowrap}
/* スマホでは7列の表をやめ、1週＝1枚のカードにする。
   横スクロールで隠れる列（実績・差・判定）が最初から全部見えるようにするため。
   見出し行は消えるので、各行の左に data-k の項目名を出す。 */
@media (max-width:560px){
  .goalb .wk .tw{overflow-x:visible}
  .goalb .wk table,.goalb .wk tr,.goalb .wk td{display:block;width:100%}
  .goalb .wk tr:first-child{display:none}
  .goalb .wk tr{border:1px solid var(--border);border-radius:var(--r);
    padding:7px 10px;margin:0 0 6px;background:var(--surface)}
  .goalb .wk tr.now{border-color:var(--c)}
  .goalb .wk tr:nth-child(2n) td{background:none}
  .goalb .wk td{border:0;padding:2px 0;text-align:right;font-size:12.5px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .goalb .wk td::before{content:attr(data-k);color:var(--muted);font-weight:600;
    font-size:11.5px;text-align:left;white-space:nowrap}
  .goalb .wk td.wkt{justify-content:flex-start;font-weight:700;font-size:13px;
    margin-bottom:3px;text-align:left}
  .goalb .wk td.wkt::before{content:none}}
/* ── 事業内容 ── */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px}
.act{border:var(--bw) solid var(--border);border-radius:var(--r);padding:9px 11px;background:var(--surface)}
.act .nm{font-size:12.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.act .qty{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.act .qty small{font-size:11px;font-weight:600;color:var(--muted)}
.act .sub2{font-size:11px;color:var(--muted);margin-top:2px}
.chip{font-size:9.5px;padding:1px 6px;border-radius:20px;font-weight:700;white-space:nowrap}
.chip.auto{background:var(--okbg);color:var(--ok)}
.chip.draft{background:var(--warnbg);color:var(--warn)}
.chip.manual{background:var(--offbg);color:var(--off)}
/* ── 分析タブ（企画分析課） ── */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin:14px 0 0;flex-wrap:wrap}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;
  color:var(--muted);padding:7px 15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover:not(:disabled){color:var(--fg)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
/* どの週／どの月を見るか。週は増え続けるのでボタン列でなく選択リストにする */
.subtabwrap{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 0}
.subtablabel{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
  text-transform:uppercase;white-space:nowrap}
.subsel{appearance:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--fg);
  background:var(--offbg);border:1px solid var(--border);border-radius:8px;
  padding:6px 30px 6px 11px;cursor:pointer;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.subsel:hover{border-color:var(--accent)}
.subsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.subtabnote{font-size:11px;color:var(--muted)}
.tabpanel[hidden]{display:none}
.dtl h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  margin:20px 0 8px;font-weight:700}
.dtl h5:first-child{margin-top:14px}
.dtl h5 .sub{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.kpi5{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:1px;
  background:var(--border);border:var(--bw) solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:4px}
.kpi5 > div{background:var(--surface);padding:9px 11px}
.kpi5 .k{font-size:10.5px;color:var(--muted)}
.kpi5 .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi5 .d{font-size:11px;color:var(--muted)}
.split{border:var(--bw) solid var(--border);border-radius:var(--r);padding:11px 13px;background:var(--surface)}
.splitbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:0 0 7px}
.splitbar i{display:block;height:100%}
.splitbar .o1{background:var(--accent)} .splitbar .r1{background:var(--off)}
.splitleg{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.splitleg b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:13px}
.splitleg span{display:flex;align-items:center;gap:6px}
.splitleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.linechart svg{width:100%;height:160px;overflow:visible}
.linechart .ax{stroke:var(--border);stroke-width:1}
.linechart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.linechart .pt{fill:var(--accent)}
.linechart .ptna{fill:var(--offbg);stroke:var(--border);stroke-width:1}
.linechart .vl{font-size:11px;font-weight:700;fill:var(--fg);text-anchor:middle;font-variant-numeric:tabular-nums}
.linechart .dl{font-size:10px;fill:var(--muted);text-anchor:middle}
.bars{display:flex;gap:5px;align-items:flex-end;margin:6px 0 2px}
.bcol{flex:1;display:flex;flex-direction:column;gap:3px}
.bcol .bv{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.bcol .barwrap{display:flex;align-items:flex-end;height:58px}
.bcol .bar{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;width:100%}
.bcol .bl{font-size:10px;color:var(--muted);text-align:center}
.emptyb{font-size:12.5px;color:var(--fg);border:1px dashed var(--border);border-radius:var(--r);
  padding:11px 13px;background:var(--subtle)}
.num{font-size:11px;color:var(--muted);font-weight:400}

/* ── 残アイディアメモ（案C：1行一覧＋タップで開く） ──
   4列テーブルはスマホでタイトルが1文字ずつ折り返すのでやめた。
   閉じている間は「優先度の点・タイトル1行・実行日」だけを出す。 */
.c-list{border:var(--bw) solid var(--border);border-radius:var(--r);
  background:var(--surface);overflow:hidden;margin:0 0 4px}
.c-item{border-top:1px solid var(--border)}
.c-item:first-child{border-top:0}
.c-item > summary{list-style:none;cursor:pointer;padding:9px 12px;
  display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:9px;align-items:center}
.c-item > summary::-webkit-details-marker{display:none}
.c-item .dot{width:8px;height:8px;border-radius:99px;background:var(--warn)}
.c-item .dot.high{background:var(--bad)} .c-item .dot.low{background:var(--off)}
.c-item .t{font-size:13.5px;font-weight:600;line-height:1.4;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-item .when{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-item .when.set{color:var(--accent);font-weight:700}
.c-item[open] > summary{background:var(--offbg)}
.c-item[open] .t{white-space:normal;overflow:visible}
.c-body{padding:2px 12px 12px 29px}
.c-body p{font-size:12.5px;color:var(--fg);margin:0 0 8px}
.c-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:12px;margin:0}
.c-dl dt{color:var(--muted)}
.c-dl dd{margin:0;font-variant-numeric:tabular-nums}
.c-stale{color:var(--bad);font-weight:700}
.pri{font-size:9.5px;padding:1px 6px;border-radius:20px;font-weight:700}
.pri.high{background:var(--badbg);color:var(--bad)}
.pri.mid{background:var(--warnbg);color:var(--warn)}
.pri.low{background:var(--offbg);color:var(--off)}
.emptyb{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r);padding:10px 12px}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;justify-content:center;margin-top:18px}
.legend span{display:flex;align-items:center;gap:5px}

/* ══════════════════════════════════════════════════════════════
   G_CSS + APPLE（案G ヒートマップの構造 ＋ Apple配色トークン上書き）
   mockup-efg-build.py の G_CSS（532〜582行）+ APPLE（636〜670行）を
   themable() 変換した出力。
   ══════════════════════════════════════════════════════════════ */
.page{max-width:1180px;margin:0 auto;padding:24px 20px 90px}
.co{border:var(--bw) solid var(--border);border-radius:var(--r-lg);background:var(--subtle);
  padding:13px 20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:16px auto 0;max-width:620px;
  justify-content:center;text-align:center}
.co .nm{font-size:15px;font-weight:700}
.co div.s{font-size:11px;color:var(--muted)}
.co div.s b{display:block;font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.co div.s b.bad{color:var(--bad)}
.stem{width:2px;height:20px;background:var(--line);margin:0 auto}
.bus{position:relative;padding-top:20px}
.bus::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--line)}
.depts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.dept{position:relative;padding-top:20px}
.dept::before{content:"";position:absolute;top:-2px;left:50%;width:2px;height:22px;background:var(--line)}
.card{width:100%;text-align:left;font:inherit;cursor:pointer;border-radius:var(--r-lg);padding:11px 12px;display:block;
  background:var(--cb);border:var(--bw) solid var(--c);transition:box-shadow .12s,transform .12s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card .nm{font-weight:var(--nmw);font-size:13.5px;margin-bottom:3px;color:var(--fg)}
.card .st{font-size:11px;color:var(--c);font-weight:700;margin-bottom:6px}
.card .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.card .num small{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-top:1px}
.card .bar{background:rgba(128,128,128,.22)}
.secs{margin-top:8px;display:flex;flex-direction:column;gap:3px;
  position:relative;padding-top:8px}
.secs::before{content:"";position:absolute;top:0;left:12px;width:2px;height:100%;background:var(--line)}
.sec{position:relative;margin-left:12px;text-align:left;font:inherit;cursor:pointer;
  border:var(--bw) solid var(--c);background:var(--cb);border-radius:var(--r);padding:5px 8px;
  font-size:11.5px;display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;
  transition:transform .1s}
.sec::before{content:"";position:absolute;left:-12px;top:50%;width:12px;height:2px;background:var(--line)}
.sec:hover{transform:translateX(2px)}
.sec .nm{font-weight:700;color:var(--fg)}
.sec .hot{font-size:10px;font-weight:700;color:var(--c);text-align:right}
.sec .meta{grid-column:1/-1;font-size:10px;color:var(--muted)}
.sec.dim{opacity:.55}
.pane{border:var(--bw) solid var(--accent);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--shadow);padding:19px 23px;margin-top:14px}
.pane .ph{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.pane h3.t{font-size:16px;margin:0;flex:1}
.x{appearance:none;border:var(--bw) solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:var(--r);width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1}
.x:hover{color:var(--fg);border-color:var(--accent)}
.tally{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 0;font-size:12px}
.tally b{font-size:15px}
.tally div{border:var(--bw) solid var(--c);background:var(--cb);color:var(--c);border-radius:999px;
  padding:6px 14px;font-weight:700;display:flex;gap:7px;align-items:baseline}
@media (max-width:980px){.depts{grid-template-columns:repeat(2,1fr)}.bus::before{display:none}}
@media (max-width:560px){.depts{grid-template-columns:1fr}.dept::before{display:none}.dept{padding-top:0}
  .page{padding:18px 14px 70px}}

:root{
  --bg:#f2f2f7; --surface:#ffffff; --fg:#1d1d1f; --muted:#6e6e73;
  --border:rgba(0,0,0,.09); --subtle:#ffffff; --line:rgba(0,0,0,.13);
  --accent:#0071e3;
  --ok:#248a3d;   --okbg:rgba(52,199,89,.13);
  --warn:#b25000; --warnbg:rgba(255,149,0,.15);
  --bad:#d70015;  --badbg:rgba(255,59,48,.12);
  --off:#6e6e73;  --offbg:rgba(120,120,128,.12);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.08);
  --r:11px; --r-lg:17px; --bw:1px; --tracking:-.008em; --nmw:600;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --fg:#f5f5f7; --muted:#98989d;

  --border:rgba(255,255,255,.13); --subtle:#1c1c1e; --line:rgba(255,255,255,.18);
  --accent:#0a84ff;
  --ok:#30d158;   --okbg:rgba(48,209,88,.17);
  --warn:#ff9f0a; --warnbg:rgba(255,159,10,.17);

.co{background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card .st{font-weight:600;letter-spacing:0}
.card .num{letter-spacing:-.02em}
.sec{box-shadow:none}

tr:nth-child(2n) td{background:rgba(120,120,128,.05)}

/* ══════════════════════════════════════════════════════════════
   TOGGLE_CSS（右上の見た目切替ボタン）
   ══════════════════════════════════════════════════════════════ */
.theme{position:fixed;top:12px;right:14px;z-index:99;display:flex;gap:2px;padding:3px;
  background:var(--surface);border:var(--bw) solid var(--border);border-radius:999px;
  box-shadow:var(--shadow)}
.theme button{appearance:none;border:0;background:none;font:inherit;font-size:11.5px;
  padding:4px 11px;border-radius:999px;cursor:pointer;color:var(--muted);line-height:1.5}
.theme button:hover{color:var(--fg)}
.theme button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
@media print{.theme{display:none}}

/* ══════════════════════════════════════════════════════════════
   2段レイアウト追加分（9.6節：モックアップは横一列だったのをここで2段に変える）
   ══════════════════════════════════════════════════════════════ */
.tier{margin:0}
.tier-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;
  margin:18px 0 0;text-align:center}
.tier-t small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.depts.n3{grid-template-columns:repeat(3,1fr)}
.depts.n2{grid-template-columns:repeat(2,1fr);max-width:66%;margin:0 auto}
/* .pane は部カードの直下（グリッドの中）に出すので grid-column:1/-1 は無効化する */
.pane{grid-column:auto;margin-top:16px}
/* 開いている部だけ行いっぱいに広げる（2026-08-03）。
   .dept は3列グリッドの1マス＝約370pxで、その中の .pane は約327px しかない。
   仕組み図（1120px想定）を入れると29%まで縮んで文字が4px相当になり読めなかった。
   閉じれば元の3列に戻る。1マスのままにしたい場合はこの1行を消すだけでよい。 */
.depts .dept.open{grid-column:1/-1}
@media (max-width:980px){
  .depts.n3,.depts.n2{grid-template-columns:repeat(2,1fr);max-width:none}}
@media (max-width:560px){
  .depts.n3,.depts.n2{grid-template-columns:1fr}}

/* ══════════════════════════════════════════════════════════════
   その場で開く（部・課とも、押したものの真下に中身を出す）
   既定は全部閉じている。部カードの下段に「課の状態の点＋件数＋›」を出し、
   閉じていても課が何個あって何色かは分かるようにする。
   ══════════════════════════════════════════════════════════════ */
.card .subs{display:flex;align-items:center;gap:6px;margin-top:8px;
  font-size:10.5px;font-weight:600;color:var(--muted)}
.card .subs .dots{display:flex;gap:3px;align-items:center}
.card .subs .dots i{width:7px;height:7px}
.chev{font-size:12px;line-height:1;color:var(--muted);
  transition:transform .15s;display:inline-block}
.card .subs .chev{margin-left:auto}
[aria-expanded="true"] .chev{transform:rotate(90deg)}
.body[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* 開いている部は行いっぱいに広がる。詳細の表が3列グリッドの幅（約370px）に
   押し込まれると日本語がひどく折り返すため、開いたときだけ全幅にする */
.dept.open{grid-column:1/-1}
.pane.inline{margin-top:8px}
.secs .body{margin-left:12px}
/* 課の行は「名前 / 一言 / ›」の3列＋下段に補助文字。4つとも明示配置する。
   自動配置に任せると ›（grid-row指定）と .meta（grid-column指定）がぶつかって並びが崩れる */
.sec{grid-template-columns:1fr auto auto}
.sec .nm{grid-column:1;grid-row:1}
.sec .hot{grid-column:2;grid-row:1}
.sec .chev{grid-column:3;grid-row:1;color:var(--c)}
.sec .meta{grid-column:1/-1;grid-row:2}

/* ══════════════════════════════════════════════════════════════
   警告バナー（9.10節）
   ══════════════════════════════════════════════════════════════ */
#alerts{display:flex;flex-direction:column;gap:8px}
.alert{border:var(--bw) solid var(--c);background:var(--cb);color:var(--c);
  border-radius:var(--r);padding:9px 14px;font-size:12.5px;font-weight:600;margin:10px 0 0}
#alerts .alert:first-child{margin-top:10px}

/* ══════════════════════════════════════════════════════════════
   横スクロール対策（ページ本体は絶対に横に伸びないようにする）

   原因：グリッドの子（.dept / .pane）は既定で min-width:auto のため、
   中の表が縮めない幅（min-content）を持つと、列幅ではなく表の幅が勝ち、
   グリッドごと画面幅を超える。スマホで実測 375px の画面に 422px が出ていた。
   対策：①グリッドの子を min-width:0 にして縮められるようにする
        ②縮めきれない表は .tw の箱の中だけで横スクロールさせる（ページは動かない）
   ══════════════════════════════════════════════════════════════ */
html{overflow-x:clip}
body{max-width:100%;overflow-x:clip}
.page,.tier,.bus,.depts,.dept,.card,.pane,.body,.dtl,.secs,.sec{min-width:0}
.card .nm,.card .num,.card .num small,.sec .nm,.sec .meta{min-width:0;overflow-wrap:anywhere}
/* 表は自分の箱の中だけで横に動く。画面に収まる表は今までどおり動かない */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 4px;max-width:100%}
.tw > table{margin-bottom:0}
/* 列が細くなりすぎて1文字ずつ縦に並ぶのを防ぐ。
   ①見出しセルは途中で折らない ②行の名前（左端の列）は最低8文字ぶんの幅を確保
   ③数字のセルは折らない。その結果 画面に収まらない表は .tw の中だけで横に動く */
.tw th{white-space:nowrap}
.tw td:first-child{min-width:8em}
.tw td{min-width:4.5em}
.tw td.n{white-space:nowrap}
/* 「未着手」「設定済み・初回待ち」のような状態は途中で折らない（1文字ずつ縦に並ぶのを防ぐ） */
.tw td.stt{white-space:nowrap}

/* ── 残To do（2列テーブルをやめる） ──
   スマホでは「やること」と「状態」が幅を取り合い、長い文がどちらも縦に潰れる。
   やることは全幅で読ませ、状態はその下にバッジで置く。 */
.todos{border:var(--bw) solid var(--border);border-radius:var(--r);
  background:var(--surface);overflow:hidden;margin:0 0 4px}
.todos > div{padding:9px 12px;border-top:1px solid var(--border)}
.todos > div:first-child{border-top:0}
.todos .tx{font-size:13px;line-height:1.62}
.todos .tx code{font-size:12px}
.todos .st{margin-top:6px}
.todos .st .flag{display:inline-block;white-space:normal}
/* パス・理由・リード文は長い英数字の連なりでも折り返す */
.path,.why,.lead,.note,.emptyb,.pacen{overflow-wrap:anywhere}
.card .subs{flex-wrap:wrap}
/* 折れ線グラフのラベルが枠外に描かれても、ページ幅には影響させない */
.linechart{overflow-x:clip}
img,svg{max-width:100%}

/* ── 用語ボード ─────────────────────────────────────────────
   「同じものに何通りも呼び名がある」を解消するための対応表。
   進捗カードとは目的が違うので、段（tier）とは分けて一番下に置く。 */
.gl{margin:0}
.gl-lead{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.gl-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.gl-tools input{flex:1 1 220px;min-width:0;font:inherit;font-size:13px;padding:7px 11px;
  border:var(--bw) solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--fg)}
.gl-tools input::placeholder{color:var(--muted)}
.gl-chips{display:flex;gap:6px;flex-wrap:wrap}
.gl-chips button{font:inherit;font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;
  border:var(--bw) solid var(--border);background:var(--surface);color:var(--muted)}
.gl-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.gl-grp{border:var(--bw) solid var(--border);border-radius:var(--r-lg);background:var(--surface);
  overflow:hidden;margin:0 0 10px;box-shadow:var(--shadow)}
.gl-grp > h3{margin:0}
.gl-grp > h3 button{width:100%;font:inherit;font-size:13.5px;font-weight:600;text-align:left;
  padding:10px 13px;background:var(--subtle);border:0;border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gl-grp > h3 button .n{font-size:11px;color:var(--muted);font-weight:400}
.gl-grp > h3 button .ar{margin-left:auto;color:var(--muted);font-size:11px;font-weight:400}
.gl-grp.closed > h3 button{border-bottom:0}
.gl-why{font-size:12px;color:var(--muted);padding:9px 13px 0;margin:0;overflow-wrap:anywhere}
.gl-it{padding:11px 13px;border-top:1px solid var(--border)}
.gl-it:first-of-type{border-top:0}
.gl-it .row1{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.gl-it .nm{font-weight:var(--nmw);font-size:14px}
.gl-it .cd{font-size:11.5px;color:var(--muted);background:var(--subtle);border-radius:5px;
  padding:.14em .45em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.gl-it .pl{font-size:13px;margin:5px 0 0;line-height:1.62;overflow-wrap:anywhere}
.gl-it .dt{font-size:12.5px;color:var(--muted);margin:5px 0 0;line-height:1.6;overflow-wrap:anywhere}
.gl-it .wh{font-size:11.5px;color:var(--muted);margin:5px 0 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.gl-empty{padding:16px 13px;font-size:13px;color:var(--muted)}

/* ── 部の詳細に差し込む資料パネル（panels/{部ID}.html）──
   図や長い表を入れる枠。既定は畳んでおき、押した人にだけ開く。 */
.panel-acc{border:var(--bw) solid var(--border);border-radius:var(--r);
  background:var(--surface);margin:8px 0 18px}
.panel-acc > summary{cursor:pointer;padding:10px 13px;font-size:13px;font-weight:600;
  background:var(--subtle);border-radius:var(--r);list-style:none}
.panel-acc[open] > summary{border-bottom:1px solid var(--border);border-radius:var(--r) var(--r) 0 0}
.panel-acc > summary::-webkit-details-marker{display:none}
.panel-acc > summary::before{content:"▶ ";color:var(--muted);font-weight:400}
.panel-acc[open] > summary::before{content:"▼ "}
.panel-acc > div{padding:4px 15px 16px}

st2)} #kflow .kf-sb.kf-g2 text{fill:var(--st2)}\n#kflow .kf-sb.kf-g3 rect{stroke:var(--st3)} #kflow .kf-sb.kf-g3 text{fill:var(--st3)}\n#kflow .kf-sb.kf-g4 rect{stroke:var(--st4)} #kflow .kf-sb.kf-g4 text{fill:var(--st4)}\n#kflow .kf-stlg{display:flex;gap:5px 15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:9px 0 0}\n#kflow .kf-stlg .kf-c{display:inline-block;min-width:21px;padding:0 2px;text-align:center;border-radius:8px;\n  border:1.4px solid;font-size:10.5px;font-weight:700;line-height:15px;margin-right:5px;vertical-align:1px}\n<\/style>\n\n<!-- ══════════════════ 1 ══════════════════ -->\n<h2><span class=\"kf-no\">1<\/span>時間の流れ（5つの段）<\/h2>\n<p class=\"kf-lead\">左から右へ。無人で動く仕事が、この順に走る。<\/p>\n\n<div class=\"kf-stages\">\n  <div class=\"kf-stg kf-g1\">\n    <div class=\"kf-when\">金・土 18時<\/div><div class=\"kf-ttl\"><span class=\"kf-n\">①<\/span> 材料を取る<\/div>\n    <dl><dt>仕事<\/dt><dd>keiba-fetch<br>（起動日の翌日ぶん）<\/dd>\n        <dt>作るもの<\/dt><dd class=\"what\"><ul>\n          <li>出走表（枠・馬・騎手・厩舎・血統・斤量・脚質）<\/li>\n          <li>各馬の近走成績と調教<\/li>\n          <li>そのコースの騎手・種牡馬・枠・脚質別の成績<\/li>\n        <\/ul><span class=\"fn\">fetch.json<\/span><\/dd><\/dl>\n  <\/div>\n  <div class=\"kf-stg kf-g2\">\n    <div class=\"kf-when\">土日月 朝6時<\/div><div class=\"kf-ttl\"><span class=\"kf-n\">②<\/span> 採点とAI予想<\/div>\n    <dl><dt>仕事<\/dt><dd>keiba-taska<\/dd>\n        <dt>作るもの<\/dt><dd class=\"what\"><ul>\n          <li>8項目の点数と、その点数になった理由（①近走 ②展開 ③④着差 ⑤調教 ⑥騎手厩舎 ⑦血統 ⑧ローテ）<\/li>\n          <li>逃げ候補・先行圧・展開シナリオ<\/li>\n          <li>AIモデルが出した各馬の勝率<\/li>\n        <\/ul><span class=\"fn\">s1・s2・s34・s5〜s8.json／ml_predict.json<\/span><\/dd><\/dl>\n  <\/div>\n  <div class=\"kf-stg kf-g3\">\n    <div class=\"kf-when\">発走 7〜13分前<\/div><div class=\"kf-ttl\"><span class=\"kf-n\">③<\/span> 勝率・印・買い目<\/div>\n    <dl><dt>仕事<\/dt><dd>keiba-taskb<br>（5分ごとに見張る<br>土日月 9:30〜18:30）<\/dd>\n        <dt>作るもの<\/dt><dd class=\"what\"><ul>\n          <li>合計点と順位／モデルの勝率・オッズの勝率・最終勝率／使ったオッズの時刻<\/li>\n          <li>買う券種・組み合わせ・金額・期待値・信頼度（見送りならその理由）<\/li>\n          <li>能力印・地雷・穴／荒れ度／ペース・馬場・枠バイアス／点数の内訳<\/li>\n        <\/ul><span class=\"fn\">predict.json／selection.json／analysis.json<\/span><\/dd><\/dl>\n  <\/div>\n  <div class=\"kf-stg kf-g4\">\n    <div class=\"kf-when\">朝6時 ＋ 発走直前<br>（1日2回）<\/div><div class=\"kf-ttl\"><span class=\"kf-n\">④<\/span> サイトに出す<\/div>\n    <dl><dt>仕事<\/dt><dd>keiba-taskb の後半<br>朝＝全レース一括<br>直前＝最終版で上書き<\/dd>\n        <dt>作るもの<\/dt><dd class=\"what\"><ul>\n          <li>③までの中身を日本語の文章にしたもの（情報充足・レース分析・全頭サマリー）<\/li>\n          <li>公開した時刻と、オッズ無しで出したかどうかの目印<\/li>\n        <\/ul><span class=\"fn\">report.md／final_publish.json<\/span><\/dd><\/dl>\n  <\/div>\n  <div class=\"kf-stg kf-g5\">\n    <div class=\"kf-when\">土日月 20時<br>→ 日月火 22時<\/div><div class=\"kf-ttl\"><span class=\"kf-n\">⑤<\/span> 答え合わせ<\/div>\n    <dl><dt>仕事<\/dt><dd>keiba-settle<br>keiba-enrich-premium<br>（翌日22時・後付け）<\/dd>\n        <dt>作るもの<\/dt><dd class=\"what\"><ul>\n          <li>着順・タイム・上がり3F・通過順・馬体重・全券種の払戻・ラップ<\/li>\n          <li>買い目1点ごとの的中と収支<\/li>\n          <li>翌日に後付けでタイム指数と備考（出遅れ 等）<\/li>\n        <\/ul><span class=\"fn\">result.json／bet_ledger.jsonl<\/span><\/dd><\/dl>\n  <\/div>\n<\/div>\n<p class=\"kf-lead\" style=\"margin-top:10px\">この5段とは別に <code>keiba-odds-snapshot<\/code> が土日月の 9:00〜18:30 に30分おき（1日20回）で走り、オッズの動きを記録し続けている（予想には使っていない）。<\/p>\n\n<!-- ══════════════════ 2 ══════════════════ -->\n<h2><span class=\"kf-no\">2<\/span>何が何を決めているか（いちばん大事な図）<\/h2>\n<p class=\"kf-lead\">サイトに出るものは3つ（印・買い目・表示勝率）。<b>この3つは途中で枝分かれしていて、お互いを見ていない。<\/b><\/p>\n\n<figure>\n<svg class=\"kf-dia\" viewBox=\"0 0 1120 660\" role=\"img\"\n     aria-label=\"材料からAI・オッズを経て、印・買い目・表示勝率の3つに枝分かれする依存関係の図\">\n  <defs>\n    <marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/>\n    <\/marker>\n  <\/defs>\n  \n\n  <text class=\"kf-colh\" x=\"30\"  y=\"28\">材料<\/text>\n  <text class=\"kf-colh\" x=\"315\" y=\"28\">モデル・計算<\/text>\n  <text class=\"kf-colh\" x=\"600\" y=\"28\">出てくる数字<\/text>\n  <text class=\"kf-colh\" x=\"885\" y=\"28\">サイトに出るもの<\/text>\n\n  <!-- 印のトラック -->\n  <rect class=\"kf-b kf-src\" x=\"30\" y=\"46\" width=\"240\" height=\"60\"/>\n  <g class=\"kf-sb kf-g1\"><rect x=\"39\" y=\"37\" width=\"27\" height=\"18\"/><text x=\"51\" y=\"50\">①<\/text><\/g>\n  <text class=\"kf-t\"  x=\"46\" y=\"72\">出走表・調教・過去走<\/text>\n  <text class=\"kf-t2\" x=\"46\" y=\"92\">fetch.json<\/text>\n\n  <rect class=\"kf-b\" x=\"315\" y=\"46\" width=\"240\" height=\"60\"/>\n  <g class=\"kf-sb kf-g2\"><rect x=\"324\" y=\"37\" width=\"27\" height=\"18\"/><text x=\"336\" y=\"50\">②<\/text><\/g>\n  <text class=\"kf-t\"  x=\"331\" y=\"72\">AI（走破時計版）<\/text>\n  <text class=\"kf-t2\" x=\"331\" y=\"92\">win-1（足し算7：枝分かれ3）<\/text>\n\n  <rect class=\"kf-b\" x=\"600\" y=\"46\" width=\"240\" height=\"60\"/>\n  <g class=\"kf-sb kf-g2\"><rect x=\"609\" y=\"37\" width=\"27\" height=\"18\"/><text x=\"621\" y=\"50\">②<\/text><\/g>\n  <text class=\"kf-t\"  x=\"616\" y=\"72\">AIの予想<\/text>\n  <text class=\"kf-t2\" x=\"616\" y=\"92\">p_win<\/text>\n\n  <rect class=\"kf-b kf-out\" x=\"885\" y=\"46\" width=\"205\" height=\"60\"/>\n  <g class=\"kf-sb kf-g4\"><rect x=\"894\" y=\"37\" width=\"27\" height=\"18\"/><text x=\"906\" y=\"50\">④<\/text><\/g>\n  <text class=\"kf-t\"  x=\"901\" y=\"72\">能力印 ◎○▲△<\/text>\n  <text class=\"kf-t3\" x=\"901\" y=\"92\">オッズは地雷の繰り上げだけ<\/text>\n\n  <path class=\"kf-e\" d=\"M270,76 H311\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e\" d=\"M555,76 H596\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e kf-hi\" d=\"M840,76 H881\" marker-end=\"url(#ar)\"/>\n\n  <!-- オッズ -->\n  <rect class=\"kf-b kf-src\" x=\"30\" y=\"150\" width=\"240\" height=\"60\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"39\" y=\"141\" width=\"27\" height=\"18\"/><text x=\"51\" y=\"154\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"46\" y=\"176\">オッズ<\/text>\n  <text class=\"kf-t2\" x=\"46\" y=\"196\">odds_all.json<\/text>\n\n  <rect class=\"kf-b\" x=\"315\" y=\"150\" width=\"240\" height=\"60\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"324\" y=\"141\" width=\"27\" height=\"18\"/><text x=\"336\" y=\"154\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"331\" y=\"176\">1 ÷ オッズ<\/text>\n  <text class=\"kf-t3\" x=\"331\" y=\"196\">合計が1になるよう直す<\/text>\n\n  <rect class=\"kf-b\" x=\"600\" y=\"150\" width=\"240\" height=\"60\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"609\" y=\"141\" width=\"27\" height=\"18\"/><text x=\"621\" y=\"154\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"616\" y=\"176\">オッズの予想<\/text>\n  <text class=\"kf-t2\" x=\"616\" y=\"196\">p_odds<\/text>\n\n  <path class=\"kf-e\" d=\"M270,180 H311\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e\" d=\"M555,180 H596\" marker-end=\"url(#ar)\"/>\n\n  <!-- 混ぜる -->\n  <rect class=\"kf-b\" x=\"600\" y=\"252\" width=\"240\" height=\"82\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"609\" y=\"243\" width=\"27\" height=\"18\"/><text x=\"621\" y=\"256\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"616\" y=\"278\">サイトに出す勝率<\/text>\n  <text class=\"kf-t2\" x=\"616\" y=\"298\">p_blend<\/text>\n  <text class=\"kf-t3\" x=\"616\" y=\"320\" style=\"fill:var(--accent)\">つまみ W_WIN ＝ 3 : 7<\/text>\n\n  <path class=\"kf-e\" d=\"M720,106 V246\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e\" d=\"M860,180 H872 V293 H845\" marker-end=\"url(#ar)\"/>\n\n  <rect class=\"kf-b kf-out\" x=\"885\" y=\"252\" width=\"205\" height=\"82\"/>\n  <g class=\"kf-sb kf-g4\"><rect x=\"894\" y=\"243\" width=\"27\" height=\"18\"/><text x=\"906\" y=\"256\">④<\/text><\/g>\n  <text class=\"kf-t\"  x=\"901\" y=\"278\">表示の勝率とEV<\/text>\n  <text class=\"kf-t3\" x=\"901\" y=\"300\">表示が主。印・買い目は<\/text>\n  <text class=\"kf-t3\" x=\"901\" y=\"316\">使わない（軸の同数決めのみ）<\/text>\n  <path class=\"kf-e kf-hi\" d=\"M840,293 H881\" marker-end=\"url(#ar)\"/>\n\n  <!-- 買い目のトラック -->\n  <rect class=\"kf-b\" x=\"315\" y=\"366\" width=\"240\" height=\"66\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"324\" y=\"357\" width=\"27\" height=\"18\"/><text x=\"336\" y=\"370\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"331\" y=\"392\">買い目えらび<\/text>\n  <text class=\"kf-t2\" x=\"331\" y=\"412\">bet-1<\/text>\n\n  <rect class=\"kf-b\" x=\"600\" y=\"366\" width=\"240\" height=\"66\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"609\" y=\"357\" width=\"27\" height=\"18\"/><text x=\"621\" y=\"370\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"616\" y=\"392\">買い目<\/text>\n  <text class=\"kf-t2\" x=\"616\" y=\"412\">selection.json<\/text>\n\n  <rect class=\"kf-b kf-out\" x=\"885\" y=\"366\" width=\"205\" height=\"66\"/>\n  <g class=\"kf-sb kf-g4\"><rect x=\"894\" y=\"357\" width=\"27\" height=\"18\"/><text x=\"906\" y=\"370\">④<\/text><\/g>\n  <text class=\"kf-t\"  x=\"901\" y=\"392\">7券種の買い目<\/text>\n  <text class=\"kf-t3\" x=\"901\" y=\"412\">買うか見送るか・点数・金額<\/text>\n\n  <path class=\"kf-e\" d=\"M150,210 V399 H311\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e\" d=\"M555,399 H596\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e kf-hi\" d=\"M840,399 H881\" marker-end=\"url(#ar)\"/>\n  <text class=\"kf-el\" x=\"163\" y=\"330\">オッズ＋馬のデータだけ<\/text>\n  <text class=\"kf-el\" x=\"163\" y=\"346\">（AIの予想も表示勝率も見ない）<\/text>\n\n  <!-- 軸 -->\n  <rect class=\"kf-b kf-out\" x=\"885\" y=\"458\" width=\"205\" height=\"60\"/>\n  <g class=\"kf-sb kf-g4\"><rect x=\"894\" y=\"449\" width=\"27\" height=\"18\"/><text x=\"906\" y=\"462\">④<\/text><\/g>\n  <text class=\"kf-t\"  x=\"901\" y=\"484\">軸<\/text>\n  <text class=\"kf-t3\" x=\"901\" y=\"504\">買い目に多く出た馬<\/text>\n  <path class=\"kf-e kf-hi\" d=\"M720,432 V488 H881\" marker-end=\"url(#ar)\"/>\n\n  <!-- 小さいモデル -->\n  <rect class=\"kf-b\" x=\"315\" y=\"552\" width=\"240\" height=\"66\"/>\n  <g class=\"kf-sb kf-g3\"><rect x=\"324\" y=\"543\" width=\"27\" height=\"18\"/><text x=\"336\" y=\"556\">③<\/text><\/g>\n  <text class=\"kf-t\"  x=\"331\" y=\"578\">専用の小さいモデル<\/text>\n  <text class=\"kf-t2\" x=\"331\" y=\"598\">jirai-1 / ana-1 / upset-2 / bigpay-1<\/text>\n\n  <rect class=\"kf-b kf-out\" x=\"885\" y=\"552\" width=\"205\" height=\"66\"/>\n  <g class=\"kf-sb kf-g4\"><rect x=\"894\" y=\"543\" width=\"27\" height=\"18\"/><text x=\"906\" y=\"556\">④<\/text><\/g>\n  <text class=\"kf-t\"  x=\"901\" y=\"578\">地雷・穴・荒れ度・100万超え<\/text>\n  <text class=\"kf-t3\" x=\"901\" y=\"598\">それぞれ別モデルが決める<\/text>\n\n  <path class=\"kf-e\" d=\"M150,210 V585 H311\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e kf-hi\" d=\"M555,585 H881\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-e\" d=\"M435,548 V436\" marker-end=\"url(#ar)\"/>\n  <text class=\"kf-el\" x=\"447\" y=\"498\">地雷・穴の点数は<\/text>\n  <text class=\"kf-el\" x=\"447\" y=\"514\">買い目えらびの材料<\/text>\n<\/svg>\n<figcaption>青い線と枠＝サイトに出るもの。灰色＝途中の計算。箱の左上のバッジ＝1節の①〜⑤のどこで作られるか。<\/figcaption>\n<div class=\"kf-stlg\">\n  <span><span class=\"kf-c\" style=\"border-color:var(--st1);color:var(--st1)\">①<\/span>材料を取る（金・土18時）<\/span>\n  <span><span class=\"kf-c\" style=\"border-color:var(--st2);color:var(--st2)\">②<\/span>採点とAI予想（朝6時）<\/span>\n  <span><span class=\"kf-c\" style=\"border-color:var(--st3);color:var(--st3)\">③<\/span>勝率・印・買い目（発走前）<\/span>\n  <span><span class=\"kf-c\" style=\"border-color:var(--st4);color:var(--st4)\">④<\/span>サイトに出す<\/span>\n  <span><span class=\"kf-c\" style=\"border-color:var(--st5);color:var(--st5)\">⑤<\/span>答え合わせ＝この図には出てこない（下の注を参照）<\/span>\n<\/div>\n<\/figure>\n<div class=\"kf-callout\"><b>バッジの読み方（2つだけ注意）。<\/b>\n右の青い列に付いている ④ は「<b>出す<\/b>」工程です。<b>中身を決めているのは ③<\/b>（能力印も軸も\n<code>analysis.json<\/code>、買い目は <code>selection.json<\/code>）で、④ はそれを <code>report.md<\/code> に文章化して\nサイトに載せるだけです。<br>\n③ の「AIの予想（<code>p_win<\/code>）」だけは ② が付いています。数字を計算しているのは ②（<code>ml_predict.json<\/code>）で、\n③ がそれを <code>predict.json<\/code> に取り込んで <code>p_win<\/code> という名前にしています。<\/div>\n<div class=\"kf-callout\"><b>⑤ 答え合わせが図に無い理由。<\/b>\nこの図は「1レースの予想が決まるまで」を描いたものなので、レースが終わってからの ⑤ は範囲の外です。\nただし切れているわけではなく、<code>result.json<\/code> → <code>keiba.sqlite<\/code> に入り、\n<b>翌週以降の ② のAIの学習データ<\/b>と、③の各種スコアの材料になって戻ってきます。<\/div>\n\n<div class=\"kf-callout\"><b>ここが分かりにくかった点。<\/b>\n「サイトに出す勝率（<code>p_blend<\/code>）」は名前のわりに<b>行き止まり<\/b>です。\n表示にしか使われておらず、印は「AIの予想」から、買い目は「買い目えらび」から、それぞれ別に決まります。\nだから <code>W_WIN<\/code>（混ぜ比率）を動かしても、印も買い目も1つも変わりません。<br>唯一の例外が「軸」で、買い目への登場回数が同数だったときの決め手に <code>p_blend<\/code> を使っています。<\/div>\n\n<div class=\"kf-callout kf-ok\"><b>逆に、名前が似ていないのに繋がっているもの。<\/b>\n「軸」は買い目から決まります。7券種の買い目に何回出てきたかを数えて、一番多い馬が軸です。\nつまり <b>買い目 → 軸<\/b> の順で、逆ではありません。<\/div>\n\n<!-- ══════════════════ 3 ══════════════════ -->\n<h2><span class=\"kf-no\">3<\/span>AIは9世代ある（積み上がっている）<\/h2>\n<p class=\"kf-lead\">世代ごとに別物ではなく、<b>前の世代に材料を足したもの<\/b>。いま印を決めているのは一番右。<\/p>\n\n<figure>\n<svg class=\"kf-dia\" viewBox=\"0 0 1120 300\" role=\"img\"\n     aria-label=\"AIの世代が初代から走破時計版まで積み上がっている図\">\n  <defs>\n    <marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/>\n    <\/marker>\n  <\/defs>\n  \n\n  <text class=\"kf-colh\" x=\"30\" y=\"26\" style=\"fill:var(--muted);font:600 11px var(--font)\">本流（前の世代に足していく）<\/text>\n\n  <rect class=\"kf-g\" x=\"30\"  y=\"42\" width=\"152\" height=\"56\"/>\n  <text class=\"kf-gt\" x=\"44\" y=\"66\">初代<\/text><text class=\"kf-gc\" x=\"44\" y=\"84\">ml-1 / fs-1<\/text>\n  <rect class=\"kf-g\" x=\"212\" y=\"42\" width=\"152\" height=\"56\"/>\n  <text class=\"kf-gt\" x=\"226\" y=\"66\">能力項目版<\/text><text class=\"kf-gc\" x=\"226\" y=\"84\">ml-2 / fs-2<\/text>\n  <rect class=\"kf-g\" x=\"394\" y=\"42\" width=\"152\" height=\"56\"/>\n  <text class=\"kf-gt\" x=\"408\" y=\"66\">全戦績版<\/text><text class=\"kf-gc\" x=\"408\" y=\"84\">ml-5 / fs-4 ⚠<\/text>\n  <rect class=\"kf-g\" x=\"576\" y=\"42\" width=\"152\" height=\"56\"/>\n  <text class=\"kf-gt\" x=\"590\" y=\"66\">スピード指数版<\/text><text class=\"kf-gc\" x=\"590\" y=\"84\">ml-6 / fs-6<\/text>\n  <rect class=\"kf-g\" x=\"758\" y=\"42\" width=\"152\" height=\"56\"/>\n  <text class=\"kf-gt\" x=\"772\" y=\"66\">騎手・通過順版<\/text><text class=\"kf-gc\" x=\"772\" y=\"84\">ml-7 / fs-7<\/text>\n  <rect class=\"kf-g\" x=\"940\" y=\"42\" width=\"150\" height=\"56\"/>\n  <text class=\"kf-gt\" x=\"954\" y=\"66\">枝分かれ混ぜ版<\/text><text class=\"kf-gc\" x=\"954\" y=\"84\">ml-8 / fs-8<\/text>\n\n  <path class=\"kf-ge\" d=\"M182,70 H208\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-ge\" d=\"M364,70 H390\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-ge\" d=\"M546,70 H572\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-ge\" d=\"M728,70 H754\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-ge\" d=\"M910,70 H936\" marker-end=\"url(#ar)\"/>\n\n  <text class=\"kf-ga\" x=\"398\" y=\"120\">⚠ ml-5 が指すのは fs-4。番号がそろっていないのはここだけ<\/text>\n\n  <!-- 枝分かれ混ぜ版からの3分岐 -->\n  <path class=\"kf-ge\" d=\"M1015,98 V150 H300 V186\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-ge\" d=\"M1015,98 V150 H660 V186\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-ge\" d=\"M1015,98 V150 H1015 V186\" marker-end=\"url(#ar)\"/>\n\n  <rect class=\"kf-g kf-off\" x=\"180\" y=\"186\" width=\"240\" height=\"66\"/>\n  <text class=\"kf-gt\" x=\"196\" y=\"211\">血統・性別版<\/text>\n  <text class=\"kf-gc\" x=\"196\" y=\"229\">ml-9 / fs-9<\/text>\n  <text class=\"kf-ga\" x=\"196\" y=\"245\">作ったが動かしていない<\/text>\n\n  <rect class=\"kf-g kf-off\" x=\"540\" y=\"186\" width=\"240\" height=\"66\"/>\n  <text class=\"kf-gt\" x=\"556\" y=\"211\">調教版<\/text>\n  <text class=\"kf-gc\" x=\"556\" y=\"229\">ml-10 / fs-10<\/text>\n  <text class=\"kf-ga\" x=\"556\" y=\"245\">スイッチだけ入って空振り<\/text>\n\n  <rect class=\"kf-g kf-now\" x=\"860\" y=\"186\" width=\"230\" height=\"66\"/>\n  <text class=\"kf-gt\" x=\"876\" y=\"211\" style=\"fill:var(--ok)\">走破時計版<\/text>\n  <text class=\"kf-gc\" x=\"876\" y=\"229\" style=\"fill:var(--ok)\">win-1（足し算7：枝分かれ3）<\/text>\n  <text class=\"kf-ga\" x=\"876\" y=\"245\" style=\"fill:var(--ok)\">いま本番<\/text>\n<\/svg>\n<figcaption>点線＝動いていないもの。緑＝いま印を決めているAI。<br>「足し算」＝項目ごとの配点を合計する計算。「枝分かれ」＝「距離は？→枠は？」と条件で分けていく計算。win-1 はこの2つを 7：3 で混ぜている。<\/figcaption>\n<\/figure>\n\n<div class=\"kf-callout\"><b>控えが3段ある。<\/b>\n毎回 枝分かれ混ぜ版が先に勝率を書き、その直後に走破時計版が上書きします。\n走破時計版が失敗したら 枝分かれ混ぜ版の結果が残り、それも失敗したら初代が残る。だから止まりません。\n「枝分かれ混ぜ版も毎回動いている」のはこのためです。<\/div>\n\n<h3>世代ごとの成績<\/h3>\n<p class=\"kf-lead\">同じ物差し・同じ1,831レースで測った値だけを並べています。\n<b>数字は小さいほど良い<\/b>（実際に勝った馬にどれだけ高い確率を出せていたか。1レースあたり）。\nどれも「足し算の部分だけ」の値で、枝分かれを混ぜる前の比較です。<\/p>\n\n<div class=\"kf-wrap\">\n<table>\n<tr><th>世代（案）<\/th><th class=\"kf-mono\">呼び名<\/th><th>足した材料<\/th><th>外し具合<br><span style=\"font-weight:400\">小さいほど良い<\/span><\/th><th>親との差<\/th><th>状態<\/th><\/tr>\n<tr><td>初代<\/td><td class=\"kf-mono\">ml-1 / fs-1<\/td><td>—（55項目）<\/td><td>2.1748<\/td><td>—<\/td><td>控え<\/td><\/tr>\n<tr><td>能力項目版<\/td><td class=\"kf-mono\">ml-2 / fs-2<\/td><td>能力13本を追加して68項目に＋学習を3.5年分に<\/td><td><b>2.1218<\/b><\/td><td>−0.0530<\/td><td>控え<\/td><\/tr>\n<tr><td><span style=\"color:var(--muted)\">（研究のみ）<\/span><\/td><td class=\"kf-mono\">fs-3<\/td><td>過去走の集計9本<\/td><td>2.1190<\/td><td>−0.0028<\/td><td>モデルなし<\/td><\/tr>\n<tr><td>全戦績版<\/td><td class=\"kf-mono\">ml-5 / fs-4<\/td><td>全キャリア戦績16本<\/td><td>2.1180<\/td><td>−0.0010<\/td><td>控え<\/td><\/tr>\n<tr><td><span style=\"color:var(--muted)\">（研究のみ）<\/span><\/td><td class=\"kf-mono\">fs-5<\/td><td>—<\/td><td>2.1160<\/td><td>−0.0020<\/td><td>モデルなし<\/td><\/tr>\n<tr><td>スピード指数版<\/td><td class=\"kf-mono\">ml-6 / fs-6<\/td><td>馬場差を引いたスピード指数2本<\/td><td><b>2.1059<\/b><\/td><td>−0.0101<\/td><td>控え<\/td><\/tr>\n<tr><td>騎手・通過順版<\/td><td class=\"kf-mono\">ml-7 / fs-7<\/td><td>騎手調教師の勝率4・距離差1・通過順5<\/td><td><b>2.0895<\/b><\/td><td>−0.0164<\/td><td>控え<\/td><\/tr>\n<tr><td>枝分かれ混ぜ版<\/td><td class=\"kf-mono\">ml-8 / fs-8<\/td><td>騎手×馬場の複勝率1本（＋枝分かれを3割）<\/td><td><b>2.0880<\/b><\/td><td>−0.0015<\/td><td>本番の控え<\/td><\/tr>\n<tr style=\"background:var(--offbg)\"><td>血統・性別版<\/td><td class=\"kf-mono\">ml-9 / fs-9<\/td><td>種牡馬・性別・ローテ区間など108列<\/td><td>2.0805<\/td><td>−0.0075<\/td><td>動いていない<\/td><\/tr>\n<tr style=\"background:var(--offbg)\"><td>調教版<\/td><td class=\"kf-mono\">ml-10 / fs-10<\/td><td>調教評価の平常値6本<\/td><td>2.0845<\/td><td>−0.0035<\/td><td>動いていない<\/td><\/tr>\n<tr style=\"background:var(--okbg)\"><td><b>走破時計版<\/b><\/td><td class=\"kf-mono\">win-1<\/td><td><b>補正済みの走破時計と上がり3F 6本<\/b><\/td><td><b>2.0760<\/b><\/td><td><b>−0.0120<\/b><\/td><td><b>いま本番<\/b><\/td><\/tr>\n<\/table>\n<\/div>\n\n<p class=\"kf-lead\">血統・性別版／調教版／走破時計版の3つは、どれも <b>枝分かれ混ぜ版（2.0880）から枝分かれ<\/b>しています。\nだから「親との差」はこの3行だけ 2.0880 との差です。3つのうち一番良かった走破時計版が本番に入りました。<br><b>いま本番の走破時計版だけ名前を <code>win-1<\/code> に付け替えてあります<\/b>（旧 ml-11 / fs-11 / K8）。他の世代は当時の記録なので ml-◯ / fs-◯ のまま残しています。<\/p>\n\n<div class=\"kf-wrap\">\n<table>\n<tr><th>参考（別の物差し／並記のみ）<\/th><th>値<\/th><th>出どころ<\/th><\/tr>\n<tr><td>本番の形（枝分かれを3割混ぜたあと）— 枝分かれ混ぜ版<\/td><td>約 2.0838<\/td><td class=\"kf-mono\">SCOREBOARD K7<\/td><\/tr>\n<tr><td>本番の形（同上）— 走破時計版<\/td><td>約 2.0671<\/td><td class=\"kf-mono\">SCOREBOARD K8<\/td><\/tr>\n<tr><td>勝ち馬への自信（大きいほど良い）— 枝分かれ混ぜ版<\/td><td>12.39%<\/td><td class=\"kf-mono\">SCOREBOARD K7lin<\/td><\/tr>\n<tr><td>勝ち馬への自信（大きいほど良い）— 走破時計版<\/td><td>12.54%<\/td><td class=\"kf-mono\">SCOREBOARD K8lin<\/td><\/tr>\n<tr><td>手作り8項目だけ（K0）<\/td><td>2.3242<\/td><td class=\"kf-mono\">SCOREBOARD（学習1年の枠）<\/td><\/tr>\n<tr><td>オッズだけ（同じ1,831レース）<\/td><td>1.9863<\/td><td>本日の実測<\/td><\/tr>\n<\/table>\n<\/div>\n<p class=\"kf-lead\">下2行は上の表と物差しが違う（K0は学習1年の枠の値、オッズだけは混合比ゼロの実測）ので、\n上の表の数字と直接引き算しないでください。<br>\n<b>上4行は研究用の装置で測った値です。<\/b>本番の形（枝分かれを3割混ぜたあと）を公式の装置で測り直した値は\n<b>2.0732<\/b>（win-1・2026-08-04 実測・1,831レース）で、<code>SCOREBOARD K8<\/code> の行はそちらに更新済みです。\nここで 2.0671 を残しているのは、1つ上の K7（約 2.0838）が研究用の装置の値のままで、\n<b>片方だけ差し替えると2行を比べられなくなる<\/b>ためです。<\/p>\n\n<h3>いまのAIは、何を見て印を決めているか<\/h3>\n<p class=\"kf-lead\">◎○▲△の順番は3ステップで決まります。<\/p>\n\n<div class=\"kf-wrap\">\n<table>\n<tr><th>順<\/th><th>やること<\/th><th>使うもの<\/th><\/tr>\n<tr><td>1<\/td><td>走破時計版が出走全馬の勝率を出す<\/td><td>足し算100項目（＋欠損の印71で計171列）と 枝分かれ を 7：3 で混ぜる<\/td><\/tr>\n<tr><td>2<\/td><td>勝率の高い順に並べる（同率なら馬番の若い順）<\/td><td class=\"kf-mono\">p_win<\/td><\/tr>\n<tr><td>3<\/td><td>上から5頭に ◎○▲△△ を付ける。地雷が付いた馬は飛ばして次点を繰り上げる<\/td><td class=\"kf-mono\">jirai-1 の判定<\/td><\/tr>\n<\/table>\n<\/div>\n\n<div class=\"kf-callout kf-ok\"><b>順位づけにオッズは使っていません。<\/b>\n2でも3でも使うのは「AIの予想」だけで、サイトに出す勝率（オッズを混ぜたほう）は使いません。\nなので「1番人気だから◎」にはなりません。地雷を飛ばす分だけ、人気馬が外れることはあります。<\/div>\n\n<p class=\"kf-lead\">では走破時計版の項目のうち、どれが強く効いているか。\n学習後の係数を絶対値の大きい順に並べたものが下です。全項目を平均0・ばらつき1にそろえてから学習しているので、\n<b>数字の大きさがそのまま効き具合<\/b>になります。まず上位15、その下に全171列を畳んで置いています。<\/p>\n\n<div class=\"kf-wrap\">\n<table>\n<tr><th>順<\/th><th class=\"kf-mono\">項目名<\/th><th>中身<\/th><th>効き具合<\/th><th>向き<\/th><\/tr>\n<tr><td>1<\/td><td class=\"kf-mono\">rating<\/td><td>自前の能力レーティング（対戦結果から積み上げた持ち点）<\/td><td>0.232<\/td><td>高いほど上位<\/td><\/tr>\n<tr><td>2<\/td><td class=\"kf-mono\">c_best_surf<\/td><td>補正済み走破時計の自己ベスト（芝ダート別）<\/td><td>0.211<\/td><td>速いほど上位<\/td><\/tr>\n<tr><td>3<\/td><td class=\"kf-mono\">training_rank_ord<\/td><td>調教の評価ランク<\/td><td>0.191<\/td><td>良いほど上位<\/td><\/tr>\n<tr><td>4<\/td><td class=\"kf-mono\">car_win_rate<\/td><td>全キャリアの勝率<\/td><td>0.191<\/td><td>高いほど上位<\/td><\/tr>\n<tr><td>5<\/td><td class=\"kf-mono\">same_surface_norm_finish<\/td><td>同じ馬場（芝／ダート）での平均着順<\/td><td>0.190<\/td><td>良いほど上位<\/td><\/tr>\n<tr><td>6<\/td><td class=\"kf-mono\">l_best5<\/td><td>補正済み上がり3Fの直近5走ベスト<\/td><td>0.167<\/td><td>速いほど上位<\/td><\/tr>\n<tr><td>7<\/td><td class=\"kf-mono\">cn_ea3<\/td><td>直近3走の1コーナー通過位置（頭数で割った値）<\/td><td>0.154<\/td><td>前にいるほど上位<\/td><\/tr>\n<tr><td>8<\/td><td class=\"kf-mono\">last_body_weight<\/td><td>前走の馬体重<\/td><td>0.150<\/td><td>重いほど上位<\/td><\/tr>\n<tr><td>9<\/td><td class=\"kf-mono\">body_weight_diff_last2__missing<\/td><td>体重増減が取れなかった、という印<\/td><td>0.143<\/td><td>欠損フラグ<\/td><\/tr>\n<tr><td>10<\/td><td class=\"kf-mono\">last_popularity<\/td><td>前走の人気<\/td><td>0.138<\/td><td>人気だったほど上位<\/td><\/tr>\n<tr><td>11<\/td><td class=\"kf-mono\">win_rate_past<\/td><td>過去走の勝率<\/td><td>0.135<\/td><td><b style=\"color:var(--warn)\">低いほど です。<\/div>\n\n<!-- ══════════════════ 5 ══════════════════ -->\n<h2><span class=\"kf-no\">5<\/span>手作り8項目はいまどこにいるか<\/h2>\n<p class=\"kf-lead\">AIが入る前は、この8項目の合計点が勝率のもとでした。<b>いまは勝率も印もAIが決めています。<\/b><\/p>\n\n<div class=\"kf-wrap\">\n<table>\n<tr><th class=\"kf-mono\">名前<\/th><th>中身<\/th><th>配点<\/th><th>いまの使われ方<\/th><\/tr>\n<tr><td class=\"kf-mono\">s1<\/td><td>近走パフォーマンス<\/td><td>10<\/td><td rowspan=\"7\">\n  ①サイトのレースページに「この馬の評価の内訳」として表示される<br>\n  ②AIが失敗したときの控えとして、合計点から勝率を作る経路が残っている<br>\n  ③AIの材料の一部にもなっている<\/td><\/tr>\n<tr><td class=\"kf-mono\">s2<\/td><td>展開・脚質<\/td><td>5<\/td><\/tr>\n<tr><td class=\"kf-mono\">s34<\/td><td>近走着差 <span style=\"color:var(--muted)\">（s3とs4は統合済み。単独では存在しない）<\/span><\/td><td>20<\/td><\/tr>\n<tr><td class=\"kf-mono\">s5<\/td><td>調教・仕上がり<\/td><td>30<\/td><\/tr>\n<tr><td class=\"kf-mono\">s6<\/td><td>騎手・調教師<\/td><td>20<\/td><\/tr>\n<tr><td class=\"kf-mono\">s7<\/td><td>血統適性<\/td><td>10<\/td><\/tr>\n<tr><td class=\"kf-mono\">s8<\/td><td>ローテ・リスク<\/td><td>5<\/td><\/tr>\n<\/table>\n<\/div>\n\n<!-- ══════════════════ 6 ══════════════════ -->\n<h2><span class=\"kf-no\">6<\/span>結果が返ってきたあと<\/h2>\n\n<figure>\n<svg class=\"kf-dia\" viewBox=\"0 0 1120 190\" role=\"img\"\n     aria-label=\"結果取得から的中判定・収支記録・モデル評価までの流れ\">\n  <defs>\n    <marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/>\n    <\/marker>\n  <\/defs>\n  \n  <rect class=\"kf-s\" x=\"30\" y=\"60\" width=\"200\" height=\"66\"/>\n  <text class=\"kf-st\" x=\"46\" y=\"88\">結果を取る<\/text><text class=\"kf-sc\" x=\"46\" y=\"107\">result.json<\/text>\n\n  <rect class=\"kf-s\" x=\"290\" y=\"20\" width=\"230\" height=\"66\"/>\n  <text class=\"kf-st\" x=\"306\" y=\"48\">的中判定・払戻<\/text><text class=\"kf-sc\" x=\"306\" y=\"67\">keiba-settle<\/text>\n\n  <rect class=\"kf-s\" x=\"290\" y=\"106\" width=\"230\" height=\"66\"/>\n  <text class=\"kf-st\" x=\"306\" y=\"134\">結果DBへ取り込み<\/text><text class=\"kf-sc\" x=\"306\" y=\"153\">keiba.sqlite<\/text>\n\n  <rect class=\"kf-s\" x=\"580\" y=\"20\" width=\"230\" height=\"66\"/>\n  <text class=\"kf-st\" x=\"596\" y=\"48\">収支の台帳<\/text><text class=\"kf-sc\" x=\"596\" y=\"67\">bet_ledger.jsonl<\/text>\n\n  <rect class=\"kf-s\" x=\"580\" y=\"106\" width=\"230\" height=\"66\"/>\n  <text class=\"kf-st\" x=\"596\" y=\"134\">次のAIの学習材料<\/text><text class=\"kf-sc\" x=\"596\" y=\"153\">ml/datasets/<\/text>\n\n  <rect class=\"kf-s\" x=\"870\" y=\"63\" width=\"220\" height=\"66\"/>\n  <text class=\"kf-st\" x=\"886\" y=\"91\">成績表<\/text><text class=\"kf-sc\" x=\"886\" y=\"110\">ml/SCOREBOARD.md<\/text>\n\n  <path class=\"kf-se\" d=\"M230,80 H250 V53 H286\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-se\" d=\"M230,106 H250 V139 H286\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-se\" d=\"M520,53 H576\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-se\" d=\"M520,139 H576\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-se\" d=\"M810,53 H840 V96 H866\" marker-end=\"url(#ar)\"/>\n  <path class=\"kf-se\" d=\"M810,139 H840 V96 H866\" marker-end=\"url(#ar)\"/>\n<\/svg>\n<\/figure>\n\n<div class=\"kf-callout\"><b>ここが一周のつなぎ目です。<\/b>\n結果が学習材料になって次の世代のAIが作られ、その成績が成績表に1行足される。\n成績表に載っていないモデルは「存在しない扱い」というルールになっています。<\/div>\n\n<h2><span class=\"kf-no\">7<\/span>まとめ — 名前を決めるときの手がかり<\/h2>\n<div class=\"kf-wrap\">\n<table>\n<tr><th>種類<\/th><th>共通点<\/th><th>数<\/th><\/tr>\n<tr><td>AIの世代<\/td><td>前の世代に材料を足したもの。名前は「足した材料」で呼べる<\/td><td>9＋手作り1<\/td><\/tr>\n<tr><td>確率<\/td><td>どれも「勝つ確率」だが、誰の予想か・混ぜたかで別物<\/td><td>6<\/td><\/tr>\n<tr><td>つまみ<\/td><td>人が手で決めている数値。学習では決まらない<\/td><td>8<\/td><\/tr>\n<tr><td>手作り8項目<\/td><td>いまは表示と控えが主な役目<\/td><td>7<\/td><\/tr>\n<tr><td>小さいモデル<\/td><td>印やラベル1つを専門に出す<\/td><td>5<\/td><\/tr>\n<tr><td>ものさし<\/td><td>良し悪しの向きが指標ごとに逆<\/td><td>7<\/td><\/tr>\n<tr><td>無人の仕事<\/td><td>launchd で時間に紐づいて走る<\/td><td>6<\/td><\/tr>\n<tr><td>ファイル<\/td><td>1レースにつき作られる（直近開催の実測）<\/td><td>20<\/td><\/tr>\n<\/table>\n<\/div>\n\n<\/div>\n<\/details>\n","glossary":{"id":"keiba","dept":"k","name":"競馬部","note":"同じものに複数の呼び名が付いているのがここの一番の混乱源。特に「AIの世代」は ml-11 / fs-11 / K8 の3通りで呼ばれていて、番号もそろっていなかった（ml-5 だけ fs-4）。 いま本番のものは 2026-08-04 に `win-1` へ一本化済み。\n","groups":[{"id":"models","name":"AIの世代","why":"同じ1つのAIに3通りの呼び名がある。ml-◯＝置き場所の番号、fs-◯＝材料セットの番号、 K◯＝実験ノート上の番号。**番号はそろっていない**（ml-5 だけ fs-4 を指す）。 いま本番のものだけ `win-1` に付け替え済みで、過去の世代は当時の記録として ml-◯ / fs-◯ のまま。 以後は右の日本語名で呼ぶ。\n","items":[{"code":"win-1（旧 ml-11 ／ fs-11 ／ K8）","name":"走破時計版","plain":"いまサイトの勝率を出しているAI。これが本番。","detail":"1つ前の「枝分かれ混ぜ版」に、補正済みの走破時計と上がり3Fを6本足したもの。 対数損失（小さいほど良い）は 2.0760 で、枝分かれ混ぜ版の 2.0880 より 0.0120 良い。 2026-08-01 から本番。\n","where":"shared/keiba/ml/models/win-1/","state":"live"},{"code":"ml-8 ／ fs-8 ／ K7","name":"枝分かれ混ぜ版","plain":"走破時計版の1つ前。今も毎回動いていて、走破時計版が失敗したときの控え。","detail":"騎手×馬場の複勝率を1本足し、「足し算」と「枝分かれ」を 7：3 で混ぜた。 毎回これが先に勝率を書き、直後に走破時計版が上書きする三段の縮退設計。\n","where":"shared/keiba/ml/models/ml-8x2023/","state":"live"},{"code":"ml-7 ／ fs-7 ／ K6","name":"騎手・通過順版","plain":"騎手と調教師の直近勝率、距離の変わり幅、コーナーの通過順を足した世代。","where":"shared/keiba/ml/models/ml-7x2023/","state":"live"},{"code":"ml-6 ／ fs-6","name":"スピード指数版","plain":"馬場差を引いた自前のスピード指数を足した世代。","where":"shared/keiba/ml/models/ml-6x2023/","state":"live"},{"code":"ml-5 ／ fs-4 ／ K5","name":"全戦績版","plain":"直近5走だけでなく全キャリアの戦績を集計して足した世代。","detail":"**番号がずれている唯一の例外**。ml-5 が指すのは fs-4。","where":"shared/keiba/ml/models/ml-5x2023/","state":"live"},{"code":"ml-2 ／ fs-2 ／ K2・K3","name":"能力項目版","plain":"項目を55から68に増やした世代。長く比較の土台に使われている。","where":"shared/keiba/ml/models/ml-2x2023/","state":"live"},{"code":"ml-1 ／ fs-1 ／ K1","name":"初代","plain":"最初のAI。55項目。いまは一番外側の控え。","where":"shared/keiba/ml/models/ml-1/","state":"live"},{"code":"ml-9 ／ fs-9","name":"血統・性別版","plain":"落ちていた文字の列（種牡馬・性別など）を拾った世代。作ったが動かしていない。","detail":"枝分かれ混ぜ版より 0.0088 良かったが採用ライン 0.01 に届かず、その後 走破時計版に 抜かれた。2026-08-03 に配線を取り下げ。材料そのものは有効で、走破時計版に 重ねたらどうなるかは未測定。\n","where":"shared/keiba/ml/models/ml-9x2023/","state":"idle"},{"code":"ml-10 ／ fs-10","name":"調教版","plain":"調教評価を足した世代。スイッチは入っているのに呼ぶコードが無く、一度も動いていない。","detail":"ml.json には 'ml-10' があるが keiba_ml_infer_fs10.py を呼ぶ箇所が無い。棚卸し中に発見（未修正）。","where":"shared/keiba/ml/models/ml-10x2023/","state":"idle"},{"code":"K0","name":"手作り8項目","plain":"AIが入る前の、人が設計して足し算していた点数。いまも8項目の点数自体は出している。","detail":"印の並び順はもうこれではなくAIの予想で決まる（2026-07-24 変更）。","where":"shared/scripts/keiba_score_s*.py","state":"live"}],"count":10},{"id":"probs","name":"確率（何種類もある）","why":"「勝つ確率」と呼ばれるものが6種類ある。どれを見ているかで話が噛み合わなくなる。","items":[{"code":"p_win","name":"AIの予想","plain":"AI（いまは走破時計版）が出した勝率。オッズを見ていない。","detail":"サイトの◎○▲△（能力印）はこれの順番で並べる。","state":"live"},{"code":"p_odds","name":"オッズの予想","plain":"1÷オッズを合計1になるように直したもの。世間全体の予想。","state":"live"},{"code":"p_blend","name":"サイトに出す勝率","plain":"AIの予想とオッズの予想を 3:7 で混ぜたもの。サイトの数字はこれ。","detail":"買い目にも能力印にも使われていない（2026-08-03 確認）。効くのは表示勝率・ 表示EV・軸の同点崩し・穴の理由文の4か所だけ。\n","state":"live"},{"code":"p_ml","name":"AI本体の生の出力","plain":"AIが書き出したそのままの数字。これが p_win として採用される。","where":"races/{race_id}/ml_predict.json","state":"live"},{"code":"p_accurate","name":"検証用の別計算","plain":"別の作り方で出した勝率。表示にも印にも買い目にも使わない。並走させて比べるためだけ。","state":"live"},{"code":"p_score ／ p_score_blend","name":"手作り版の退避コピー","plain":"AIを採用する前の、手作り8項目で出した勝率。戻せるように残してある。","state":"live"},{"code":"estimated_prob","name":"（表示上の名前）","plain":"サイトのデータに出てくる名前。中身は「サイトに出す勝率」と同じもの。","state":"ref"}],"count":7},{"id":"knobs","name":"つまみ（手で決めている数値）","why":"学習で決まる値と、人が決め打ちしている値が混ざっている。ここは人が決めている側。","items":[{"code":"W_WIN = 0.30","name":"AIとオッズの混ぜ比率","plain":"サイトの勝率を作るとき、AIの予想を何割入れるか。いまは3割。","detail":"0.1 に下げたほうが当たり具合は良い（対数損失 −0.0068・小さいほど良い）が、 変わるのは表示数字だけなので 2026-08-03 に据え置きで決着。\n","where":"shared/scripts/keiba_prob.py ／ keiba_prob_adopt.py","state":"live"},{"code":"BETA = 0.243","name":"手作り点数の効かせ方","plain":"手作り8項目の合計点を勝率に直すときの「差の付け方」。大きいほど上位馬に確率が寄る。","where":"shared/scripts/keiba_prob.py","state":"live"},{"code":"blend_alpha = 0.3","name":"足し算と枝分かれの混ぜ比率","plain":"AIの中身は2種類。「足し算」（項目ごとの配点を合計する）が7割、「枝分かれ」（条件で分けていく）が3割。","state":"live"},{"code":"
