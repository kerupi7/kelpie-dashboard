const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
(async () => {
  try { const k = localStorage.getItem("kelpie-key-" + P.salt); if (k) await open(await crypto.subtle.importKey("raw", b64(k), "AES-GCM", true, ["decrypt"])); } catch (e) {}
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const err = document.getElementById("err"); err.textContent = "開いています…";
  try {
    const key = await keyFrom(document.getElementById("pw").value);
    if (document.getElementById("keep").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem("kelpie-key-" + P.salt, btoa(String.fromCharCode(...raw))); } catch (_) {}
    }
    await open(key);
  } catch (_) { err.textContent = "パスワードが違います"; }
});
