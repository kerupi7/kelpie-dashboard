<!-- 既定はダーク。JS を待たずに最初からダークで描く（読み込み時に白く光らないように） -->
<!doctype html><html lang="ja" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Kelpie.Inc 全事業ダッシュボード</title>
<style>
/* ══════════════════════════════════════════════════════════════
   BASE（共通トークン・チップ・表・詳細パネルの体裁）
   docs/company-dashboard/mockup-efg-build.py の BASE（211〜266行）を
   themable() 変換した出力。中身は作り直していない（9.3節）。
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fff; --surface:#fff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --subtle:#f6f8fa;
  --accent:#0969da; --line:#c6cdd5;
  --ok:#2b8a3e; --okbg:#d3f9d8; --warn:#e67700; --warnbg:#fff3bf;
  --bad:#c92a2a; --badbg:#ffe3e3; --off:#868e96; --offbg:#e9ecef;
  --shadow:0 1px 3px rgba(31,35,40,.10),0 8px 24px rgba(31,35,40,.06);
  --r:9px; --r-lg:11px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --bw:1px; --tracking:normal; --nmw:800;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--surface:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;
  --accent:#4493f8;--line:#4a525c;--ok:#3fb950;--okbg:#0f2e18;--warn:#d29922;--warnbg:#3a2c05;
  --bad:#f85149;--badbg:#3a1417;--off:#8b949e;--offbg:#21262d;
  --shadow:0 1px 3px rgba(1,4,9,.6),0 8px 24px rgba(1,4,9,.4);}}:root[data-theme="dark"]{
  --bg:#0d1117;--surface:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;
  --accent:#4493f8;--line:#4a525c;--ok:#3fb950;--okbg:#0f2e18;--warn:#d29922;--warnbg:#3a2c05;
  --bad:#f85149;--badbg:#3a1417;--off:#8b949e;--offbg:#21262d;
  --shadow:0 1px 3px rgba(1,4,9,.6),0 8px 24px rgba(1,4,9,.4);}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 var(--font);letter-spacing:var(--tracking);
  -webkit-font-smoothing:antialiased}
/* button は color を継承しない。指定しないとダークモードで UA の ButtonText（黒）が
   そのまま出て、色付きカードの上の数字が読めなくなる（実測コントラスト比 1.4）。 */
button{color:inherit;font-family:inherit}
h1{font-size:19px;margin:0 0 3px} .sub{color:var(--muted);font-size:12.5px;margin:0}
a{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.g{--c:var(--ok);--cb:var(--okbg)} .y{--c:var(--warn);--cb:var(--warnbg)}
.r{--c:var(--bad);--cb:var(--badbg)} .o{--c:var(--off);--cb:var(--offbg)}
.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}
.dot.r{background:var(--bad)}.dot.o{background:var(--off)}
.flag{font-size:10.5px;padding:1px 7px;border-radius:20px;white-space:nowrap;font-weight:600;
  background:var(--cb);color:var(--c)}
.flag.g{background:var(--okbg);color:var(--ok)}.flag.y{background:var(--warnbg);color:var(--warn)}
.flag.r{background:var(--badbg);color:var(--bad)}.flag.o{background:var(--offbg);color:var(--off)}
.bar{height:5px;border-radius:3px;background:var(--offbg);overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.g{background:var(--ok)}.bar i.y{background:var(--warn)}
.bar i.r{background:var(--bad)}.bar i.o{background:var(--off)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 4px}
th,td{border:1px solid var(--border);padding:5px 10px;text-align:left}
th{background:var(--subtle);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:nth-child(2n) td{background:var(--subtle)}
code{background:var(--subtle);border-radius:5px;padding:.12em .38em;font-size:88%;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.dtl h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  margin:18px 0 8px;font-weight:700}
.dtl h3:first-child{margin-top:0}
.dtl ol,.dtl ul{margin:0;padding-left:1.4em;font-size:13.5px}
.dtl li{margin:.3em 0}
.dtl .path{font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin:0 0 12px}
.dtl .lead{margin:0 0 16px;font-size:13.5px}
.dtl .why{font-size:12px;color:var(--c);font-weight:600;margin:0 0 10px}
/* ── 月次目標ブロック（詳細パネルの先頭・案B） ── */
.goalb{border:var(--bw) solid var(--c);background:var(--cb);border-radius:var(--r-lg);padding:14px 16px;margin:0 0 18px}
.goalb .gh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.goalb .gh .ttl{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.03em}
.goalb .gh .due{font-size:11px;color:var(--muted);margin-left:auto}
.goalb .hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.goalb .pct{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--c)}
.goalb .pct small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.goalb .rem{display:flex;gap:24px;flex-wrap:wrap}
.goalb .rem .k{font-size:10.5px;color:var(--muted)}
.goalb .rem .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.goalb .bar{background:rgba(128,128,128,.22)}
.goalb .pacen{font-size:12px;color:var(--muted);margin:10px 0 0}
.goalb .pacen b{color:var(--fg);font-variant-numeric:tabular-nums}
/* ── 事業内容 ── */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px}
.act{border:var(--bw) solid var(--border);border-radius:var(--r);padding:9px 11px;background:var(--surface)}
.act .nm{font-size:12.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.act .qty{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.act .qty small{font-size:11px;font-weight:600;color:var(--muted)}
.act .sub2{font-size:11px;color:var(--muted);margin-top:2px}
.chip{font-size:9.5px;padding:1px 6px;border-radius:20px;font-weight:700;white-space:nowrap}
.chip.auto{background:var(--okbg);color:var(--ok)}
.chip.draft{background:var(--warnbg);color:var(--warn)}
.chip.manual{background:var(--offbg);color:var(--off)}
/* ── 分析タブ（企画分析課） ── */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin:14px 0 0;flex-wrap:wrap}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;
  color:var(--muted);padding:7px 15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover:not(:disabled){color:var(--fg)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
/* どの週／どの月を見るか。週は増え続けるのでボタン列でなく選択リストにする */
.subtabwrap{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 0}
.subtablabel{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
  text-transform:uppercase;white-space:nowrap}
.subsel{appearance:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--fg);
  background:var(--offbg);border:1px solid var(--border);border-radius:8px;
  padding:6px 30px 6px 11px;cursor:pointer;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.subsel:hover{border-color:var(--accent)}
.subsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.subtabnote{font-size:11px;color:var(--muted)}
.tabpanel[hidden]{display:none}
.dtl h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  margin:20px 0 8px;font-weight:700}
.dtl h5:first-child{margin-top:14px}
.dtl h5 .sub{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.kpi5{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:1px;
  background:var(--border);border:var(--bw) solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:4px}
.kpi5 > div{background:var(--surface);padding:9px 11px}
.kpi5 .k{font-size:10.5px;color:var(--muted)}
.kpi5 .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi5 .d{font-size:11px;color:var(--muted)}
.split{border:var(--bw) solid var(--border);border-radius:var(--r);padding:11px 13px;background:var(--surface)}
.splitbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:0 0 7px}
.splitbar i{display:block;height:100%}
.splitbar .o1{background:var(--accent)} .splitbar .r1{background:var(--off)}
.splitleg{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.splitleg b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:13px}
.splitleg span{display:flex;align-items:center;gap:6px}
.splitleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.linechart svg{width:100%;height:160px;overflow:visible}
.linechart .ax{stroke:var(--border);stroke-width:1}
.linechart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.linechart .pt{fill:var(--accent)}
.linechart .ptna{fill:var(--offbg);stroke:var(--border);stroke-width:1}
.linechart .vl{font-size:11px;font-weight:700;fill:var(--fg);text-anchor:middle;font-variant-numeric:tabular-nums}
.linechart .dl{font-size:10px;fill:var(--muted);text-anchor:middle}
.bars{display:flex;gap:5px;align-items:flex-end;margin:6px 0 2px}
.bcol{flex:1;display:flex;flex-direction:column;gap:3px}
.bcol .bv{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.bcol .barwrap{display:flex;align-items:flex-end;height:58px}
.bcol .bar{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;width:100%}
.bcol .bl{font-size:10px;color:var(--muted);text-align:center}
.emptyb{font-size:12.5px;color:var(--fg);border:1px dashed var(--border);border-radius:var(--r);
  padding:11px 13px;background:var(--subtle)}
.num{font-size:11px;color:var(--muted);font-weight:400}

/* ── 残アイディアメモ（案C：1行一覧＋タップで開く） ──
   4列テーブルはスマホでタイトルが1文字ずつ折り返すのでやめた。
   閉じている間は「優先度の点・タイトル1行・実行日」だけを出す。 */
.c-list{border:var(--bw) solid var(--border);border-radius:var(--r);
  background:var(--surface);overflow:hidden;margin:0 0 4px}
.c-item{border-top:1px solid var(--border)}
.c-item:first-child{border-top:0}
.c-item > summary{list-style:none;cursor:pointer;padding:9px 12px;
  display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:9px;align-items:center}
.c-item > summary::-webkit-details-marker{display:none}
.c-item .dot{width:8px;height:8px;border-radius:99px;background:var(--warn)}
.c-item .dot.high{background:var(--bad)} .c-item .dot.low{background:var(--off)}
.c-item .t{font-size:13.5px;font-weight:600;line-height:1.4;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-item .when{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-item .when.set{color:var(--accent);font-weight:700}
.c-item[open] > summary{background:var(--offbg)}
.c-item[open] .t{white-space:normal;overflow:visible}
.c-body{padding:2px 12px 12px 29px}
.c-body p{font-size:12.5px;color:var(--fg);margin:0 0 8px}
.c-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:12px;margin:0}
.c-dl dt{color:var(--muted)}
.c-dl dd{margin:0;font-variant-numeric:tabular-nums}
.c-stale{color:var(--bad);font-weight:700}
.pri{font-size:9.5px;padding:1px 6px;border-radius:20px;font-weight:700}
.pri.high{background:var(--badbg);color:var(--bad)}
.pri.mid{background:var(--warnbg);color:var(--warn)}
.pri.low{background:var(--offbg);color:var(--off)}
.emptyb{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r);padding:10px 12px}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;justify-content:center;margin-top:18px}
.legend span{display:flex;align-items:center;gap:5px}

/* ══════════════════════════════════════════════════════════════
   G_CSS + APPLE（案G ヒートマップの構造 ＋ Apple配色トークン上書き）
   mockup-efg-build.py の G_CSS（532〜582行）+ APPLE（636〜670行）を
   themable() 変換した出力。
   ══════════════════════════════════════════════════════════════ */
.page{max-width:1180px;margin:0 auto;padding:24px 20px 90px}
.co{border:var(--bw) solid var(--border);border-radius:var(--r-lg);background:var(--subtle);
  padding:13px 20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:16px auto 0;max-width:620px;
  justify-content:center;text-align:center}
.co .nm{font-size:15px;font-weight:700}
.co div.s{font-size:11px;color:var(--muted)}
.co div.s b{display:block;font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.co div.s b.bad{color:var(--bad)}
.stem{width:2px;height:20px;background:var(--line);margin:0 auto}
.bus{position:relative;padding-top:20px}
.bus::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--line)}
.depts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.dept{position:relative;padding-top:20px}
.dept::before{content:"";position:absolute;top:-2px;left:50%;width:2px;height:22px;background:var(--line)}
.card{width:100%;text-align:left;font:inherit;cursor:pointer;border-radius:var(--r-lg);padding:11px 12px;display:block;
  background:var(--cb);border:var(--bw) solid var(--c);transition:box-shadow .12s,transform .12s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card .nm{font-weight:var(--nmw);font-size:13.5px;margin-bottom:3px;color:var(--fg)}
.card .st{font-size:11px;color:var(--c);font-weight:700;margin-bottom:6px}
.card .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.card .num small{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-top:1px}
.card .bar{background:rgba(128,128,128,.22)}
.secs{margin-top:8px;display:flex;flex-direction:column;gap:3px;
  position:relative;padding-top:8px}
.secs::before{content:"";position:absolute;top:0;left:12px;width:2px;height:100%;background:var(--line)}
.sec{position:relative;margin-left:12px;text-align:left;font:inherit;cursor:pointer;
  border:var(--bw) solid var(--c);background:var(--cb);border-radius:var(--r);padding:5px 8px;
  font-size:11.5px;display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;
  transition:transform .1s}
.sec::before{content:"";position:absolute;left:-12px;top:50%;width:12px;height:2px;background:var(--line)}
.sec:hover{transform:translateX(2px)}
.sec .nm{font-weight:700;color:var(--fg)}
.sec .hot{font-size:10px;font-weight:700;color:var(--c);text-align:right}
.sec .meta{grid-column:1/-1;font-size:10px;color:var(--muted)}
.sec.dim{opacity:.55}
.pane{border:var(--bw) solid var(--accent);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--shadow);padding:19px 23px;margin-top:14px}
.pane .ph{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.pane h3.t{font-size:16px;margin:0;flex:1}
.x{appearance:none;border:var(--bw) solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:var(--r);width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1}
.x:hover{color:var(--fg);border-color:var(--accent)}
.tally{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 0;font-size:12px}
.tally b{font-size:15px}
.tally div{border:var(--bw) solid var(--c);background:var(--cb);color:var(--c);border-radius:999px;
  padding:6px 14px;font-weight:700;display:flex;gap:7px;align-items:baseline}
@media (max-width:980px){.depts{grid-template-columns:repeat(2,1fr)}.bus::before{display:none}}
@media (max-width:560px){.depts{grid-template-columns:1fr}.dept::before{display:none}.dept{padding-top:0}
  .page{padding:18px 14px 70px}}

:root{
  --bg:#f2f2f7; --surface:#ffffff; --fg:#1d1d1f; --muted:#6e6e73;
  --border:rgba(0,0,0,.09); --subtle:#ffffff; --line:rgba(0,0,0,.13);
  --accent:#0071e3;
  --ok:#248a3d;   --okbg:rgba(52,199,89,.13);
  --warn:#b25000; --warnbg:rgba(255,149,0,.15);
  --bad:#d70015;  --badbg:rgba(255,59,48,.12);
  --off:#6e6e73;  --offbg:rgba(120,120,128,.12);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.08);
  --r:11px; --r-lg:17px; --bw:1px; --tracking:-.008em; --nmw:600;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --fg:#f5f5f7; --muted:#98989d;
  --border:rgba(255,255,255,.13); --subtle:#1c1c1e; --line:rgba(255,255,255,.18);
  --accent:#0a84ff;
  --ok:#30d158;   --okbg:rgba(48,209,88,.17);
  --warn:#ff9f0a; --warnbg:rgba(255,159,10,.17);
  --bad:#ff453a;  --badbg:rgba(255,69,58,.17);
  --off:#98989d;  --offbg:rgba(120,120,128,.22);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45);}}:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fg:#f5f5f7; --muted:#98989d;
  --border:rgba(255,255,255,.13); --subtle:#1c1c1e; --line:rgba(255,255,255,.18);
  --accent:#0a84ff;
  --ok:#30d158;   --okbg:rgba(48,209,88,.17);
  --warn:#ff9f0a; --warnbg:rgba(255,159,10,.17);
  --bad:#ff453a;  --badbg:rgba(255,69,58,.17);
  --off:#98989d;  --offbg:rgba(120,120,128,.22);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45);}
.co{background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card .st{font-weight:600;letter-spacing:0}
.card .num{letter-spacing:-.02em}
.sec{box-shadow:none}
.tally div{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pane{border-color:transparent;box-shadow:var(--shadow)}
th{background:rgba(120,120,128,.08)}
tr:nth-child(2n) td{background:rgba(120,120,128,.05)}
h1{letter-spacing:-.021em;font-weight:700}
.bar{background:rgba(120,120,128,.18);height:6px;border-radius:99px}
.bar i{border-radius:99px}

/* ══════════════════════════════════════════════════════════════
   TOGGLE_CSS（右上の見た目切替ボタン）
   ══════════════════════════════════════════════════════════════ */
.theme{position:fixed;top:12px;right:14px;z-index:99;display:flex;gap:2px;padding:3px;
  background:var(--surface);border:var(--bw) solid var(--border);border-radius:999px;
  box-shadow:var(--shadow)}
.theme button{appearance:none;border:0;background:none;font:inherit;font-size:11.5px;
  padding:4px 11px;border-radius:999px;cursor:pointer;color:var(--muted);line-height:1.5}
.theme button:hover{color:var(--fg)}
.theme button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
@media print{.theme{display:none}}

/* ══════════════════════════════════════════════════════════════
   2段レイアウト追加分（9.6節：モックアップは横一列だったのをここで2段に変える）
   ══════════════════════════════════════════════════════════════ */
.tier{margin:0}
.tier-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;
  margin:18px 0 0;text-align:center}
.tier-t small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.depts.n3{grid-template-columns:repeat(3,1fr)}
.depts.n2{grid-template-columns:repeat(2,1fr);max-width:66%;margin:0 auto}
/* .pane は部カードの直下（グリッドの中）に出すので grid-column:1/-1 は無効化する */
.pane{grid-column:auto;margin-top:16px}
@media (max-width:980px){
  .depts.n3,.depts.n2{grid-template-columns:repeat(2,1fr);max-width:none}}
@media (max-width:560px){
  .depts.n3,.depts.n2{grid-template-columns:1fr}}

/* ══════════════════════════════════════════════════════════════
   その場で開く（部・課とも、押したものの真下に中身を出す）
   既定は全部閉じている。部カードの下段に「課の状態の点＋件数＋›」を出し、
   閉じていても課が何個あって何色かは分かるようにする。
   ══════════════════════════════════════════════════════════════ */
.card .subs{display:flex;align-items:center;gap:6px;margin-top:8px;
  font-size:10.5px;font-weight:600;color:var(--muted)}
.card .subs .dots{display:flex;gap:3px;align-items:center}
.card .subs .dots i{width:7px;height:7px}
.chev{font-size:12px;line-height:1;color:var(--muted);
  transition:transform .15s;display:inline-block}
.card .subs .chev{margin-left:auto}
[aria-expanded="true"] .chev{transform:rotate(90deg)}
.body[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* 開いている部は行いっぱいに広がる。詳細の表が3列グリッドの幅（約370px）に
   押し込まれると日本語がひどく折り返すため、開いたときだけ全幅にする */
.dept.open{grid-column:1/-1}
.pane.inline{margin-top:8px}
.secs .body{margin-left:12px}
/* 課の行は「名前 / 一言 / ›」の3列＋下段に補助文字。4つとも明示配置する。
   自動配置に任せると ›（grid-row指定）と .meta（grid-column指定）がぶつかって並びが崩れる */
.sec{grid-template-columns:1fr auto auto}
.sec .nm{grid-column:1;grid-row:1}
.sec .hot{grid-column:2;grid-row:1}
.sec .chev{grid-column:3;grid-row:1;color:var(--c)}
.sec .meta{grid-column:1/-1;grid-row:2}

/* ══════════════════════════════════════════════════════════════
   警告バナー（9.10節）
   ══════════════════════════════════════════════════════════════ */
#alerts{display:flex;flex-direction:column;gap:8px}
.alert{border:var(--bw) solid var(--c);background:var(--cb);color:var(--c);
  border-radius:var(--r);padding:9px 14px;font-size:12.5px;font-weight:600;margin:10px 0 0}
#alerts .alert:first-child{margin-top:10px}

/* ══════════════════════════════════════════════════════════════
   横スクロール対策（ページ本体は絶対に横に伸びないようにする）

   原因：グリッドの子（.dept / .pane）は既定で min-width:auto のため、
   中の表が縮めない幅（min-content）を持つと、列幅ではなく表の幅が勝ち、
   グリッドごと画面幅を超える。スマホで実測 375px の画面に 422px が出ていた。
   対策：①グリッドの子を min-width:0 にして縮められるようにする
        ②縮めきれない表は .tw の箱の中だけで横スクロールさせる（ページは動かない）
   ══════════════════════════════════════════════════════════════ */
html{overflow-x:clip}
body{max-width:100%;overflow-x:clip}
.page,.tier,.bus,.depts,.dept,.card,.pane,.body,.dtl,.secs,.sec{min-width:0}
.card .nm,.card .num,.card .num small,.sec .nm,.sec .meta{min-width:0;overflow-wrap:anywhere}
/* 表は自分の箱の中だけで横に動く。画面に収まる表は今までどおり動かない */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 4px;max-width:100%}
.tw > table{margin-bottom:0}
/* 列が細くなりすぎて1文字ずつ縦に並ぶのを防ぐ。
   ①見出しセルは途中で折らない ②行の名前（左端の列）は最低8文字ぶんの幅を確保
   ③数字のセルは折らない。その結果 画面に収まらない表は .tw の中だけで横に動く */
.tw th{white-space:nowrap}
.tw td:first-child{min-width:8em}
.tw td{min-width:4.5em}
.tw td.n{white-space:nowrap}
/* 「未着手」「設定済み・初回待ち」のような状態は途中で折らない（1文字ずつ縦に並ぶのを防ぐ） */
.tw td.stt{white-space:nowrap}

/* ── 残To do（2列テーブルをやめる） ──
   スマホでは「やること」と「状態」が幅を取り合い、長い文がどちらも縦に潰れる。
   やることは全幅で読ませ、状態はその下にバッジで置く。 */
.todos{border:var(--bw) solid var(--border);border-radius:var(--r);
  background:var(--surface);overflow:hidden;margin:0 0 4px}
.todos > div{padding:9px 12px;border-top:1px solid var(--border)}
.todos > div:first-child{border-top:0}
.todos .tx{font-size:13px;line-height:1.62}
.todos .tx code{font-size:12px}
.todos .st{margin-top:6px}
.todos .st .flag{display:inline-block;white-space:normal}
/* パス・理由・リード文は長い英数字の連なりでも折り返す */
.path,.why,.lead,.note,.emptyb,.pacen{overflow-wrap:anywhere}
.card .subs{flex-wrap:wrap}
/* 折れ線グラフのラベルが枠外に描かれても、ページ幅には影響させない */
.linechart{overflow-x:clip}
img,svg{max-width:100%}

   付かなかった。案内を出して止める。
   ※この近くに差し込み用の目印を書き写さないこと。render が全部置換するため、
     コメントの中にまでJSONが流し込まれてファイルが倍に膨らむ（実際にやった） */
let D = null;
try { D = JSON.parse(document.getElementById('dashboard-data').textContent); } catch(e) { D = null; }

const STATE_LABEL = {g:'順調', y:'注意・判断待ち', r:'止まっている', o:'休眠'};

/* 表はすべて .tw の箱に入れる。画面より広い表はページではなく箱の中だけが横に動く */
function tw(html){ return '<div class="tw">'+html+'</div>'; }
function tbl(k){ if(!k) return "";
  return tw('<table><tr>'+k.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
    k.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i&&/^[\d,.\-−+%]+$/.test(String(c))?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</table>');
}

/* 月次目標ブロック（詳細パネルの先頭・達成率と残りを主役にする） */
const MODE_LABEL = {auto:'自動', draft:'下書きのみ自動', manual:'手動'};
/* 単位と向きはソース側が決める。unit/hero_sub/stats/pace_html が無いときは
   X運用部の従来の組み立てにそのまま落ちる（＝X側の表示は1文字も変わらない）。
   競馬部のように「小さいほど良い」目標では着地見込み（proj）を出さない。 */
function goalHTML(g){
  const u = (g.unit==null) ? '人' : g.unit;
  const down = (g.direction === 'down');
  const pct = (g.pct==null) ? '—' : g.pct.toFixed(0)+'%';
  const bar = (g.pct_for_bar==null) ? '' :
    '<div class="bar"><i class="'+g.cls+'" style="width:'+g.pct_for_bar+'%"></i></div>';
  const stale = (g.staleness_days!=null && g.staleness_days>=3)
    ? ' <span class="flag y">計測が'+g.staleness_days+'日前</span>' : '';
  /* samples が null のソースでは「計測が0点だけ」を出さない（点火0本は異常ではない） */
  const few = (g.samples!=null && g.samples<2)
    ? ' <span class="flag y">計測が'+g.samples+'点だけ</span>' : '';
  const dirFlag = down ? ' <span class="flag '+g.cls+'">小さいほど良い</span>' : '';
  const proj = (!down && g.projected!=null && g.target!=null)
    ? '　／　このペースだと <b>'+g.projected.toLocaleString()+u+'（'+
      (g.projected-g.target>=0?'+':'')+(g.projected-g.target).toLocaleString()+'）</b>' : '';
  const heroSub = g.hero_sub ? g.hero_sub
    : ((g.latest==null?'未計測':g.latest.toLocaleString())+' / '+(g.target||'—').toLocaleString()+u);
  const stats = (g.stats && g.stats.length) ? g.stats : [
    {k:'残り', v:(g.remaining==null?'—':g.remaining.toLocaleString()+u)},
    {k:'残り日数', v:(g.remaining_days==null?'—':g.remaining_days+'日')}];
  const pace = g.pace_html ? g.pace_html
    : ('必要ペース <b>'+g.need_per_day+'</b>　／　今日以降 <b>'+g.need_from_now+
       '</b>　／　実績 <b>'+g.actual_per_day+'</b>'+proj);
  return '<div class="goalb '+g.cls+'">'+
    '<div class="gh"><span class="ttl">今月の目標 — '+g.label+' '+
      (g.target_label || (g.target||'').toLocaleString())+u+'</span>'+
      dirFlag+few+stale+'<span class="due">期限 '+(g.deadline||'—')+'</span></div>'+
    '<div class="hero"><div class="pct">'+pct+'<small>'+heroSub+'</small></div>'+
      '<div class="rem">'+stats.map(s=>
        '<div><div class="k">'+s.k+'</div><div class="v">'+s.v+'</div></div>').join('')+
      '</div></div>'+bar+
    '<p class="pacen">'+pace+'</p></div>';
}
function actsHTML(list){
  return '<div class="acts">'+list.map(a=>
    '<div class="act"><div class="nm">'+a.name+
      '<span class="chip '+a.mode+'">'+(MODE_LABEL[a.mode]||a.mode)+'</span></div>'+
      '<div class="qty">'+a.qty+(a.unit?'<small> '+a.unit+'</small>':'')+'</div>'+
      (a.note?'<div class="sub2">'+a.note+'</div>':'')+
    '</div>').join('')+'</div>';
}
/* 案C：閉じている間は1行（点・タイトル・実行日）。押すと本文と日付が開く。
   実行日は frontmatter の due:。未設定なら「未定」。30日以上動いていないものは赤字。 */
function ideasHTML(x){
  if(!x.count) return '<div class="emptyb">'+(x.empty_text||'未処理のアイディアはありません。')+'</div>';
  return '<div class="c-list">'+x.items.map(i=>{
    const dueShort = i.due ? i.due.slice(5) : '未定';
    const age = (i.age==null) ? '—' : (i.age>=30 ? '<span class="c-stale">'+i.age+'日前</span>' : i.age+'日前');
    // 既定は全部閉じる（開いた状態で始めない）
    return '<details class="c-item">'+
      '<summary><i class="dot '+i.priority+'"></i>'+
        '<span class="t">'+i.title+'</span>'+
        '<span class="when'+(i.due?' set':'')+'">'+dueShort+'</span></summary>'+
      '<div class="c-body">'+
        (i.body?'<p>'+i.body+'</p>':'')+
        '<dl class="c-dl">'+
          '<dt>実行日</dt><dd>'+(i.due||'未定')+'</dd>'+
          '<dt>記録日</dt><dd>'+i.created+'（'+age+'）</dd>'+
          '<dt>優先度</dt><dd><span class="pri '+i.priority+'">'+i.priority+'</span></dd>'+
        '</dl>'+
      '</div></details>';
  }).join('')+'</div>';
}

/* 分析タブ（企画分析課）。collector が型つきブロックまで組んで渡してくる。
   ここは型ごとの描画だけを持つ。 */
function blkKpi(b){
  return (b.title?'<h5>'+b.title+(b.flag?' <span class="flag y" style="text-transform:none;letter-spacing:0">'+b.flag+'</span>':'')+'</h5>':'')+
    '<div class="kpi5">'+b.items.map(i=>'<div><div class="k">'+i.k+'</div><div class="v">'+i.v+'</div>'+
      (i.d?'<div class="d">'+i.d+'</div>':'')+'</div>').join('')+'</div>';
}
function blkTable(b){
  return '<h5>'+b.title+(b.sub?' <span class="sub">'+b.sub+'</span>':'')+'</h5>'+
    tw('<table><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
    b.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i&&/^[\d,.\-−+%件日本]+$/.test(String(c).replace(/<[^>]+>/g,''))?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+
    '</table>')+(b.note?'<p class="note">'+b.note+'</p>':'');
}
function blkSplit(b){
  return '<h5>'+b.title+'</h5><div class="split">'+
    '<div class="splitbar"><i class="o1" style="width:'+b.orig_pct+'%"></i><i class="r1" style="width:'+b.reply_pct+'%"></i></div>'+
    '<div class="splitleg"><span><i style="background:var(--accent)"></i>'+b.orig_label+'</span>'+
    '<span><i style="background:var(--off)"></i>'+b.reply_label+'</span></div>'+
    (b.note?'<p class="note">'+b.note+'</p>':'')+'</div>';
}
function blkLine(b){
  const pts=b.points, n=pts.length, vals=pts.filter(p=>p.value!=null).map(p=>p.value);
  const mx=Math.max(1,...vals);
  const x=i=>40+i*(620/Math.max(1,n-1)), y=v=>130-(v/mx)*105;
  const seg=pts.map((p,i)=>p.value==null?null:x(i)+','+y(p.value).toFixed(1)).filter(Boolean).join(' ');
  return '<h5>'+b.title+(b.sub?' <span class="sub">'+b.sub+'</span>':'')+'</h5>'+
    '<div class="linechart"><svg viewBox="0 0 700 160" preserveAspectRatio="none" role="img" aria-label="'+b.title+'">'+
    '<line x1="40" y1="130" x2="660" y2="130" class="ax"/>'+
    '<polyline class="ln" points="'+seg+'"/>'+
    pts.map((p,i)=>p.value==null
      ? '<circle class="ptna" cx="'+x(i)+'" cy="130" r="4"/>'
      : '<circle class="pt" cx="'+x(i)+'" cy="'+y(p.value).toFixed(1)+'" r="4"/>').join('')+
    pts.map((p,i)=>'<text class="vl" x="'+x(i)+'" y="'+(p.value==null?120:Math.max(12,y(p.value)-10)).toFixed(1)+'">'+
      (p.value==null?'—':p.value.toLocaleString())+'</text>').join('')+
    pts.map((p,i)=>'<text class="dl" x="'+x(i)+'" y="147">'+p.label+'</text>'+
      (p.sub?'<text class="dl" x="'+x(i)+'" y="157">'+p.sub+'</text>':'')).join('')+
    '</svg></div>'+(b.note?'<p class="note">'+b.note+'</p>':'');
}
function blkBars(b){
  const mx=Math.max(1,...b.points.map(p=>p.value||0));
  return '<h5>'+b.title+(b.sub?' <span class="sub">'+b.sub+'</span>':'')+'</h5>'+
    '<div class="bars">'+b.points.map(p=>'<div class="bcol"><span class="bv">'+(p.value||0).toLocaleString()+'</span>'+
      '<div class="barwrap"><div class="bar" style="height:'+Math.max(2,(p.value||0)/mx*100)+'%"></div></div>'+
      '<span class="bl">'+p.label+'</span></div>').join('')+'</div>'+
    (b.note?'<p class="note">'+b.note+'</p>':'');
}
function blkEmpty(b){
  return '<h5>'+b.title+'</h5><div class="emptyb">'+b.text+'</div>';
}
const BLK={kpi:blkKpi, cmp:blkTable, table:blkTable, split:blkSplit, line:blkLine, bars:blkBars, empty:blkEmpty};
function blocksHTML(bs){ return (bs||[]).map(b=>(BLK[b.type]||(()=>''))(b)).join(''); }
/* タブの中身。subtabs があれば「どの週／どの月を見るか」の選択リストを挟む。
   週は毎週増えるのでボタン列ではなく select にする（横に伸び続けない） */
function tabBody(t, grp){
  const subs=t.subtabs;
  if(!subs || !subs.length) return blocksHTML(t.blocks);
  /* 既定で開くのは selected を立てたもの。無ければ先頭 */
  let di=subs.findIndex(s=>s.selected); if(di<0) di=0;
  const opts=subs.map((s,i)=>'<option value="'+grp+'-'+s.id+'"'+(i===di?' selected':'')+'>'+
    s.label+'</option>').join('');
  const panels=subs.map((s,i)=>'<div class="tabpanel" id="tp-'+grp+'-'+s.id+'"'+(i===di?'':' hidden')+'>'+
    blocksHTML(s.blocks)+'</div>').join('');
  return '<div class="subtabwrap">'+
    (t.subtabs_label?'<label class="subtablabel" for="sel-'+grp+'">'+t.subtabs_label+'</label>':'')+
    '<select class="subsel" id="sel-'+grp+'">'+opts+'</select>'+
    (t.subtabs_note?'<span class="subtabnote">'+t.subtabs_note+'</span>':'')+
    '</div>'+panels;
}
function analysisHTML(a, sid){
  const tabs=a.tabs;
  const btns=tabs.map((t,i)=>'<button data-tab="'+sid+'-'+t.id+'" data-grp="'+sid+'"'+
    (t.disabled?' disabled title="'+(t.title_attr||'')+'"':'')+
    ' aria-selected="'+(!t.disabled&&i===0?'true':'false')+'">'+t.label+'</button>').join('');
  const panels=tabs.filter(t=>!t.disabled).map((t,i)=>
    '<div class="tabpanel" id="tp-'+sid+'-'+t.id+'"'+(i===0?'':' hidden')+'>'+
    tabBody(t, sid+'-'+t.id)+'</div>').join('');
  return '<div class="tabs">'+btns+(a.as_of_label?'<span class="num" style="margin-left:auto;align-self:center">'+a.as_of_label+'</span>':'')+'</div>'+panels;
}

/* 9.9節：詳細パネルの中身の組み立て（空のブロックは見出しごと省略）
   並び：月次目標 → path/理由/lead → 事業内容 → 1日のスケジュール → 数字 →
         必要な改善 → 残アイディアメモ → 残To do → いつ時点か */
function detail(o){
  const parts = [];
  if(o.monthly_goal) parts.push(goalHTML(o.monthly_goal));
  parts.push('<p class="path">'+o.path+'</p>');
  const reasonDetail = o.state_reason_detail ? '（'+o.state_reason_detail+'）' : '';
  parts.push('<p class="why">'+(o.state_reason||'')+reasonDetail+'</p>');
  parts.push('<p class="lead">'+o.lead+'</p>');
  if(o.activities && o.activities.length) parts.push('<h3>事業内容</h3>'+actsHTML(o.activities));
  /* 見出しは部ごとに変えられる。競馬部は週サイクル（金取得→土日予測→日月火確定）で、
     1日単位にすると土日に全部が寄り平日が空になるため「週のスケジュール」にする。 */
  if(o.schedule) parts.push('<h3>'+(o.schedule_title||'1日のスケジュール')+'</h3>'+tbl(o.schedule)+
    (o.schedule_note?'<p class="note">'+o.schedule_note+'</p>':''));
  if(o.kpis) parts.push('<h3>数字</h3>'+tbl(o.kpis));
  if(o.analysis) parts.push(analysisHTML(o.analysis, o.id));
  if(o.extra_html) parts.push(o.extra_html);
  if(o.improvements && o.improvements.length)
    parts.push('<h3>必要な改善</h3><ol>'+o.improvements.map(i=>'<li>'+i+'</li>').join('')+'</ol>');
  if(o.ideas) parts.push('<h3>残アイディアメモ'+
    (o.ideas.count?' <span style="text-transform:none;letter-spacing:0;font-weight:600">（'+o.ideas.count+'件・未処理）</span>':'')+
    '</h3>'+ideasHTML(o.ideas));
  if(o.todos && o.todos.length)
    parts.push('<h3>残To do</h3><div class="todos">'+
      o.todos.map(t=>'<div><div class="tx">'+t.text+'</div>'+
        '<div class="st"><span class="flag '+(t.severity||'o')+'">'+t.status+'</span></div></div>').join('')+'</div>');
  if(o.sources_used && o.sources_used.length)
    parts.push('<h3>いつ時点か</h3>'+tw('<table><tr><th>ソース</th><th>いつ時点</th><th>状態</th></tr>'+
      o.sources_used.map(s=>'<tr><td>'+s.id+'</td><td class="stt">'+(s.as_of||'—')+'</td><td class="stt">'+s.status+'</td></tr>').join('')+'</table>'));
  return parts.join('');
}

/* 5.3節：達成率バーは headline.kind が pct/ratio のときだけ描く */
function headlineHTML(h){
  if(!h) return '';
  if(h.kind==='pct' || h.kind==='ratio'){
    return '<div class="num">'+h.value+(h.label?'<small>'+h.label+'</small>':'')+'</div>'+
      '<div class="bar"><i class="'+h.bar_cls+'" style="width:'+h.pct_for_bar+'%"></i></div>';
  }
  return '<div class="num">'+(h.value||'—')+(h.label?'<small>'+h.label+'</small>':'')+'</div>';
}

/* 週・月の選択リスト。選んだものだけ出す。ここも委譲で受ける */
document.addEventListener('change', e => {
  const sel = e.target.closest('select.subsel');
  if(!sel) return;
  Array.from(sel.options).forEach(o => {
    const panel = document.getElementById('tp-'+o.value);
    if(panel) panel.hidden = (o.value !== sel.value);
  });
});

/* 分析タブの切替。パネルは開閉のたびに作り直されるため、document へのイベント委譲で受ける */
document.addEventListener('click', e => {
  const btn = e.target.closest('.tabs button[data-tab]');
  if(!btn || btn.disabled) return;
  const grp = btn.dataset.grp;
  document.querySelectorAll('.tabs button[data-grp="'+grp+'"]').forEach(b=>{
    if(b.disabled) return;
    const on = b===btn;
    b.setAttribute('aria-selected', on?'true':'false');
    const panel = document.getElementById('tp-'+b.dataset.tab);
    if(panel) panel.hidden = !on;
  });
});

/* 既定は全部閉じている。開いている部・課のidをここに持つ（複数同時に開ける） */
const openDepts = new Set();
const openSecs  = new Set();

/* 押したものの真下に出す詳細パネル。ページ末尾には出さない（9.8.1節） */
function paneHTML(o, isSec){
  return '<div class="pane inline '+o.cls+'"><div class="ph">'+
    '<span class="flag '+o.cls+'">'+(isSec?'課':'部')+'</span>'+
    '<h3 class="t">'+o.name+'</h3>'+
    '<button class="x" data-close="'+o.id+'" aria-label="閉じる">×</button></div>'+
    '<div class="dtl">'+detail(o)+'</div></div>';
}

/* 閉じている間も課の数と色が分かるように、部カードの下段に点を並べる */
function subsHTML(d){
  const secs = d.sections || [];
  if(!secs.length) return '';
  return '<div class="subs"><span class="dots">'+
    secs.map(s=>'<i class="dot '+s.cls+'" title="'+s.name+'：'+STATE_LABEL[s.cls]+'"></i>').join('')+
    '</span><span>課'+secs.length+'</span><span class="chev" aria-hidden="true">›</span></div>';
}

function secsHTML(d){
  const secs = d.sections || [];
  if(!secs.length) return '';
  return '<div class="secs">'+secs.map(s=>{
    const on = openSecs.has(s.id);
    return '<button class="sec '+s.cls+(s.dim?' dim':'')+'" data-k="'+s.id+
      '" aria-expanded="'+on+'" aria-controls="body-'+s.id+'">'+
      '<span class="nm">'+s.name+'</span><span class="hot">'+(s.hot||'')+'</span>'+
      '<span class="chev" aria-hidden="true">›</span>'+
      '<span class="meta">'+(s.meta||'')+'</span></button>'+
      '<div class="body" id="body-'+s.id+'"'+(on?'':' hidden')+'>'+(on?paneHTML(s,true):'')+'</div>';
  }).join('')+'</div>';
}

function cardHTML(d){
  const on = openDepts.has(d.id);
  return '<div class="dept'+(on?' open':'')+'">'+
    '<button class="card '+d.cls+'" data-k="'+d.id+'" aria-expanded="'+on+'" aria-controls="body-'+d.id+'">'+
    '<div class="nm">'+d.name+'</div><div class="st">'+STATE_LABEL[d.cls]+'</div>'+
    headlineHTML(d.headline)+
    subsHTML(d)+
    '</button>'+
    '<div class="body" id="body-'+d.id+'"'+(on?'':' hidden')+'>'+
    (on ? paneHTML(d,false)+secsHTML(d) : '')+
    '</div></div>';
}

function drawTier(tierId, hostId){
  document.getElementById(hostId).innerHTML =
    D.departments.filter(d=>d.tier===tierId).map(cardHTML).join('');
}

function renderCompany(){
  const c = D.company;
  document.getElementById('co').innerHTML =
    '<div class="nm">'+c.name+'</div>'+
    '<div class="s">月次売上<b class="'+(c.revenue_current_is_zero?'bad':'')+'">'+c.revenue_current_label+
      (c.revenue_recorded_stale?' <span class="flag y">古い手書き</span>':'')+'</b></div>'+
    '<div class="s">目標<b>'+c.goal_label+'</b></div>'+
    '<div class="s">収益化した部<b>'+c.activated_count+' / '+c.revenue_departments_count+'</b></div>'+
    '<div class="s">稼働中の自動実行<b>'+c.launchd_count+'</b></div>'+
    '<div class="s">一番近い部<b>'+(c.closest_dept?(c.closest_dept.name+' '+c.closest_dept.pct+'%'):'—')+'</b></div>';
}

function renderTally(){
  const all = [...D.departments, ...D.departments.flatMap(d=>d.sections||[])];
  const c = {r:0,y:0,g:0,o:0};
  all.forEach(o=>{ if(o.cls in c) c[o.cls]++; });
  document.getElementById('tally').innerHTML = ['r','y','g','o'].map(k=>
    '<div class="'+k+'"><b>'+c[k]+'</b>'+STATE_LABEL[k]+'</div>').join('');
}

/* 9.10節：叩き忘れ対策は render 時ではなく、ページを開いた時点の日付とJSで比較する */
function renderMeta(){
  const gen = new Date(D.generated_at);
  const pad = n => String(n).padStart(2,'0');
  const genLabel = gen.getFullYear()+'-'+pad(gen.getMonth()+1)+'-'+pad(gen.getDate())+' '+pad(gen.getHours())+':'+pad(gen.getMinutes());
  const sectionCount = D.departments.reduce((n,d)=>n+((d.sections||[]).length),0);
  document.getElementById('sub').textContent = genLabel+' に作成 ／ 部'+D.departments.length+'・課'+sectionCount;

  const ageDays = Math.floor((Date.now() - gen.getTime()) / 86400000);
  const dynamicAlerts = [];
  if(ageDays>=2){
    dynamicAlerts.push({cls:'r', text:'このページは'+ageDays+'日前に作られたものです。build_dashboard.py run で作り直してください'});
  }
  const staticAlerts = D.alerts || [];
  document.getElementById('alerts').innerHTML =
    dynamicAlerts.concat(staticAlerts).map(a=>'<div class="alert '+a.cls+'">⚠️ '+a.text+'</div>').join('');
}

function drawAll(){
  drawTier('revenue', 'grid-revenue');
  drawTier('backoffice', 'grid-backoffice');
}

/* 部を閉じるときは、その部の課の詳細も閉じる（隠れたまま開きっぱなしにしない） */
function closeNode(id){
  if(openDepts.has(id)){
    openDepts.delete(id);
    const d = D.departments.find(x=>x.id===id);
    ((d && d.sections) || []).forEach(s=>openSecs.delete(s.id));
  } else {
    openSecs.delete(id);
  }
}

document.addEventListener('click', e=>{
  const closeBtn = e.target.closest('[data-close]');
  if(closeBtn){ closeNode(closeBtn.dataset.close); drawAll(); return; }
  const b = e.target.closest('[data-k]');
  if(!b) return;
  const k = b.dataset.k;
  const set = b.classList.contains('card') ? openDepts : openSecs;
  if(set.has(k)) closeNode(k); else set.add(k);
  drawAll();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (openDepts.size || openSecs.size)){
    openDepts.clear(); openSecs.clear(); drawAll();
  }
});

if(D){
  renderMeta();
  renderCompany();
  drawAll();
  renderTally();
}else{
  document.getElementById('sub').textContent = 'データが入っていません';
  document.getElementById('alerts').innerHTML =
    '<div class="alert y">⚠️ これは<b>ひな型のファイル</b>で、中身は入っていません。'+
    '出来上がったページはこちらです：<code>docs/company-dashboard/out/index.html</code>'+
    '<br>作り直すときは <code>python3 shared/scripts/build_dashboard.py run</code></div>';
}
</script>
<script>
(function(){
  const KEY='kelpie-dash-theme';
  const btns=[...document.querySelectorAll('.theme button')];
  /* 「自動」は廃止。ライトかダークのどちらかで、既定はダーク。
     以前 auto を選んでいた人（保存値が auto）はダークに寄せる */
  function apply(v){
    if(v!=='light') v='dark';
    document.documentElement.setAttribute('data-theme',v);
    btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===v)));
    try{ localStorage.setItem(KEY,v); }catch(e){}
  }
  btns.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.th)));
  let saved='dark'; try{ saved=localStorage.getItem(KEY)||'dark'; }catch(e){}
  apply(saved);
})();
</script>
</body></html>
